<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fix log · Куток</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Deliberately NOT the project's token layer. This page is a dev tool
         with its own visual identity — every token it uses is defined in its
         own style block, so it can never drift when the app restyles. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for UI, JetBrains Mono for index data. The page is sometimes
         opened from a LAN box with no internet: both declare full system
         fallbacks in the token block, so offline just means plainer type. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Theme is decided BEFORE the stylesheet paints anything: an explicit
         choice from localStorage wins, otherwise the OS preference. Stamping
         data-theme unconditionally means the CSS needs exactly one light
         block and zero prefers-color-scheme duplication. */
      document.documentElement.dataset.theme =
        localStorage.getItem('fixlog-theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    </script>
    <style>
      /* ══════════════════════════════════════════════════════════════════════
         Fix log — a scanning surface, styled as an instrument.

         This page deliberately does NOT use Kutok's design-system token layer
         (design-system/tokens.css). It is a dev tool that sits next to a
         terminal and a dark IDE, usually on a second monitor, usually in the
         evening — so it dresses like the tools around it (Linear, Vercel,
         Raycast), not like the product it observes. Every token it needs is
         defined right here; nothing leaks in from design-system/tokens.css
         and nothing leaks out.

         The colour strategy is monochrome-plus-state: cool-tinted neutral
         surfaces, full-contrast ink as the only "accent", and chroma spent
         EXCLUSIVELY on meaning — blue is incoming or running, red is sent
         back, green is a closed rework; done is a quiet checkbox, because
         finished work is furniture, not news. If something on this page is coloured,
         it is a state, never a decoration. That is what keeps eight columns
         readable: colour is so rare that one glance finds everything that
         needs a human.

         Two themes, one grammar. Dark is the native habitat (terminal at
         night); light exists for daylight and for sitting next to the light
         app in the drawer. The light palette is weighed on its own — white
         panels on a cool near-white ground, ink pulled darker, state hues
         pulled darker to keep their contrast — not a lazy inversion. Every
         theme-dependent value is a token; the rules below never branch.

         Two typefaces on one contrast axis: Inter carries the UI and the prose,
         JetBrains Mono carries every piece of INDEX data — numbers, times,
         durations, ids, agent lanes. Mono is not flavour here; it is the visual
         marker for "machine-generated value you might quote back", and it makes
         digits line up down a column for free.

         Hierarchy, loud to quiet — eight columns cannot all matter equally:

           1. Запит — the meaning. It takes every pixel the fixed columns leave
              over, in the brightest ink on the page.
           2. Статус — categorical. A coloured DOT, not a chip: colour only
              where it means "needs you". Зроблено is the resting state and
              stays neutral, or nine rows in ten would be green.
           3. Агент — supporting identity. Small mono, ink not a box.
           4. # / Час / Трив. — index data. Mono, muted, never competing.
           5. Деталі / Доробки — CONTROLS, not data. Past every content column,
              at the right edge, drawn as bare glyphs of one size that hold
              almost no ink until they are reached for.

         Rework THREADS. A fix that was sent back grows child rows — one per
         iteration, hung under the parent with mono branch glyphs (├ └), the
         reviewer's note where the request would be, and the iteration's own
         status and clock. The thread is the page's second subject: it is the
         self-training corpus (request → what the agent did → why it was
         rejected → what the redo fixed) made visible, so it reads as one
         connected block, tinted while any iteration is still open.
         ══════════════════════════════════════════════════════════════════════ */

      :root {
        /* Semantic stacking order, so nothing here is ever a magic 999. */
        --z-sticky: 1;
        --z-drawer: 50;
        --z-modal:  60;

        --font-ui:   'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

        /* Small radii throughout — this is an instrument, not a card deck. */
        --r-xs: 4px;
        --r-sm: 6px;
        --r-md: 8px;
        --r-lg: 12px;

        /* Fast and decisive: users are mid-task, choreography would be lag. */
        --dur-fast: 120ms;
        --dur: 200ms;
        --ease-out: cubic-bezier(.22, 1, .36, 1);

        /* ══ DARK — the default palette, also the fallback if the boot script
           never ran. A tiny head script stamps data-theme before first paint
           (localStorage choice, else prefers-color-scheme), so the light block
           below only ever needs to exist once. ══ */

        /* Native controls, scrollbars and form widgets follow the page instead
           of flashing light-grey inside a dark tool. */
        color-scheme: dark;

        /* ── Surfaces ── one hue for the whole ground: a cool 265° tint at
           whisper chroma, four lightness stops. The page is the darkest, panels
           sit one stop up, hover one more — depth is lightness, never shadow,
           because shadows die on a near-black ground. */
        --bg:        oklch(0.165 0.008 265);  /* the page */
        --bg-raised: oklch(0.205 0.009 265);  /* table shell, toolbar, dialogs */
        --bg-hover:  oklch(0.245 0.010 265);  /* interactive rest → approach */
        --bg-inset:  oklch(0.130 0.007 265);  /* code chips, inputs — carved in */
        --row-hover: oklch(1 0 0 / 0.03);     /* the clickable-row affordance */
        --scrim:     oklch(0 0 0 / 0.6);

        /* Hairlines are ink-with-alpha, not painted greys: they composite
           correctly over every surface stop above without a variant each. */
        --line:        oklch(1 0 0 / 0.07);
        --line-strong: oklch(1 0 0 / 0.14);
        --line-hover:  oklch(1 0 0 / 0.22);

        /* ── Ink ── four steps down from near-white. --faint is decorative
           only (branch glyphs, disabled) — it does not pass text contrast and
           must never carry words. */
        --ink:   oklch(0.93 0.004 265);
        --ink-2: oklch(0.80 0.006 265);
        --muted: oklch(0.66 0.010 265);
        --faint: oklch(0.50 0.010 265);

        /* ── State — the only chroma on the page ── */
        --info:        oklch(0.72 0.13 245);         /* в роботі */
        --info-soft:   oklch(0.72 0.13 245 / 0.09);
        --info-sheen:  oklch(0.72 0.13 245 / 0.18);
        --info-line:   oklch(0.72 0.13 245 / 0.35);
        --danger:      oklch(0.71 0.17 25);          /* на доробці */
        --danger-soft: oklch(0.71 0.17 25 / 0.10);
        --danger-sheen: oklch(0.71 0.17 25 / 0.20);
        --danger-line: oklch(0.71 0.17 25 / 0.35);
        --success:     oklch(0.76 0.14 155);         /* rework closed */
        --success-soft: oklch(0.76 0.14 155 / 0.12);
        --lane-op:     oklch(0.78 0.11 195);         /* opencode — its own hue,
                          deliberately NOT the wip blue: "who did it" and
                          "what state is it in" must never look related. */
        --lane-imp:    oklch(0.70 0.11 40);          /* ≈ #D97757 — Claude's
                          brand orange, worn only when impeccable joined. */

        /* One focus ring for every control. Blue, not white: on a monochrome
           page a white ring is indistinguishable from a hover border. */
        --ring: 0 0 0 1.5px oklch(0.72 0.13 245 / 0.75);

        /* Panels rely on borders in the dark; the shadows are backup depth.
           --shadow-card is none here on purpose: lightness steps do the
           lifting, and a shadow on near-black is mud. */
        --shadow-drawer: -24px 0 48px oklch(0 0 0 / 0.4);
        --shadow-pop: 0 24px 48px oklch(0 0 0 / 0.5);
        --shadow-card: none;
        --shadow-stuck: 0 8px 16px -8px oklch(0 0 0 / 0.5);

        /* The one filled button: on a monochrome tool the primary action is
           ink-coloured — brighter than everything, coloured like nothing. */
        --btn-primary-hover: oklch(1 0 0);
      }

      /* ══ LIGHT — weighed on its own, not inverted dark. White panels float
         on a cool near-white ground (same 265° family, never a warm cream),
         hairlines flip to black-alpha, and every state hue drops ~0.15 L so it
         still clears text contrast on white. ══ */
      :root[data-theme='light'] {
        color-scheme: light;

        --bg:        oklch(0.965 0.003 265);
        --bg-raised: oklch(1 0 0);
        --bg-hover:  oklch(0.945 0.004 265);
        --bg-inset:  oklch(0.955 0.004 265);
        --row-hover: oklch(0 0 0 / 0.025);
        --scrim:     oklch(0.2 0.01 265 / 0.4);

        --line:        oklch(0 0 0 / 0.08);
        --line-strong: oklch(0 0 0 / 0.15);
        --line-hover:  oklch(0 0 0 / 0.25);

        --ink:   oklch(0.22 0.010 265);
        --ink-2: oklch(0.36 0.012 265);
        --muted: oklch(0.50 0.012 265);
        --faint: oklch(0.72 0.008 265);

        --info:        oklch(0.55 0.15 245);
        --info-soft:   oklch(0.55 0.15 245 / 0.08);
        --info-sheen:  oklch(0.55 0.15 245 / 0.15);
        --info-line:   oklch(0.55 0.15 245 / 0.30);
        --danger:      oklch(0.55 0.19 25);
        --danger-soft: oklch(0.55 0.19 25 / 0.08);
        --danger-sheen: oklch(0.55 0.19 25 / 0.16);
        --danger-line: oklch(0.55 0.19 25 / 0.30);
        --success:     oklch(0.52 0.13 155);
        --success-soft: oklch(0.52 0.13 155 / 0.10);
        --lane-op:     oklch(0.52 0.10 210);
        /* Darker than the brand swatch on purpose: #D97757 on white is a
           ~3:1 glyph — enough for a mark, but a step of extra ink keeps it
           unmistakable at 14px. */
        --lane-imp:    oklch(0.62 0.12 40);

        --ring: 0 0 0 1.5px oklch(0.55 0.15 245 / 0.6);

        /* On white the border does less work, the shadow does more. */
        --shadow-drawer: -16px 0 40px oklch(0.2 0.01 265 / 0.18);
        --shadow-pop: 0 16px 40px oklch(0.2 0.01 265 / 0.22);
        --shadow-card: 0 1px 2px oklch(0.2 0.01 265 / 0.05), 0 2px 8px oklch(0.2 0.01 265 / 0.04);
        --shadow-stuck: 0 8px 16px -8px oklch(0.2 0.01 265 / 0.22);

        --btn-primary-hover: oklch(0.10 0.01 265);
      }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 20px 20px 40px;
        background: var(--bg);
        color: var(--ink-2);
        font: 400 13px/1.5 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        /* The page is also the body of a 92%-wide drawer inside the app; it may
           never push a horizontal scrollbar onto its host. The table scrolls
           inside its own box instead. */
        overflow-x: hidden;
      }

      /* Full width on purpose: the log is scanned, not read as prose, and it
         lives inside a 92%-wide drawer. A measure cap would waste the space
         the drawer exists to give. */
      .wrap { width: 100%; margin: 0; }

      /* A `display` declaration outranks the UA's `[hidden] { display: none }`,
         so anything that sets display MUST restore the hidden case itself —
         otherwise the element is permanently on screen. */
      .pop[hidden], .dr[hidden], .dr__rate[hidden],
      .pop__body[hidden], .pop__note[hidden], .pop__send[hidden] { display: none; }

      /* ── Page head ────────────────────────────────────────────────────────
         Title, tally, actions — one toolbar line. The tally carries the same
         dots as the Статус column, in the same colours, so the column needs no
         legend of its own. Counts are mono: they are index data like everything
         else the machine produced. */
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        margin-bottom: 14px;
      }
      /* Лого стоїть найпершим у шапці — тобто в самому верху сторінки, — і
         навмисно тихо: це підпис «яку систему ця панель спостерігає», а не
         банер. Тому висота прив'язана до кегля h1 поруч (16px), а не задана
         своя, і мітка трохи приглушена — інакше єдина кольорова пляма
         сторінки була б декорацією, а тут колір належить станам.

         `favicon.svg` — знак Кутка (кремове тло + терракотовий глиф) з
         власними, фіксованими кольорами, тому на відміну від білого
         словесного лого SplitMart тут не треба інвертувати нічого під
         світлу тему — знак однаково читається на обох тлах. */
      .brand {
        display: block;
        height: 18px;
        width: auto;
        opacity: 0.85;
        flex: 0 0 auto;
      }
      h1 {
        margin: 0;
        color: var(--ink);
        font: 600 16px/1.3 var(--font-ui);
        letter-spacing: -0.01em;
      }
      .tally {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        color: var(--muted);
        font: 500 12px/1 var(--font-ui);
      }
      .tally__i { display: inline-flex; align-items: center; gap: 6px; }
      .tally__i b {
        color: var(--ink);
        font: 600 12px/1 var(--font-mono);
      }

      .head__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
      .reload {
        padding: 5px 12px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        background: var(--bg-raised);
        color: var(--ink-2);
        font: 500 12px/1.4 var(--font-ui);
        cursor: pointer;
        transition: color var(--dur-fast) var(--ease-out),
                    border-color var(--dur-fast) var(--ease-out),
                    background-color var(--dur-fast) var(--ease-out);
      }
      .reload:hover { background: var(--bg-hover); color: var(--ink); }
      .reload:focus-visible { outline: none; box-shadow: var(--ring); }
      .reload[disabled] { opacity: .5; cursor: default; background: var(--bg-raised); color: var(--muted); }
      /* Housekeeping, not a primary action: it clears the browser's own copies
         and is reached for once a week, so it rests borderless at label weight
         and only grows an edge on approach. */
      .reload--quiet { border-color: transparent; background: none; color: var(--muted); }
      .reload--quiet:hover { border-color: var(--line-strong); background: var(--bg-raised); color: var(--ink-2); }
      /* A toggle that is ON looks like a button being held down: filled and
         full-ink, so the mode is readable from the chrome without opening
         the table. */
      .reload[aria-pressed='true'] { border-color: var(--line-strong); background: var(--bg-hover); color: var(--ink); }

      /* ── Segmented switch (Всі / По сторінках) ────────────────────────────
         Раніше це була одна кнопка-тумблер «За сторінками»: увімкнений режим
         було видно, а от ЩО буде, якщо натиснути, — ні, і другого режиму на
         екрані взагалі не існувало. Сегменти показують обидва стани одразу й
         називають їх, тож перемикач читається без спроби. */
      .seg {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        background: var(--bg-inset);
      }
      .seg__b {
        padding: 3px 11px;
        border: 0;
        border-radius: calc(var(--r-sm) - 2px);
        background: none;
        color: var(--muted);
        font: 500 12px/1.4 var(--font-ui);
        cursor: pointer;
        transition: color var(--dur-fast) var(--ease-out),
                    background-color var(--dur-fast) var(--ease-out);
      }
      .seg__b:hover { color: var(--ink-2); }
      .seg__b:focus-visible { outline: none; box-shadow: var(--ring); }
      /* Вибраний сегмент — підняте тло на вдавленому ґрунті смуги: та сама
         пара поверхонь, що й у решти сторінки, замість окремого акценту. */
      .seg__b[aria-pressed='true'] {
        background: var(--bg-raised);
        color: var(--ink);
        box-shadow: var(--shadow-card);
      }
      /* Theme toggle: shows the theme you would SWITCH TO, not the current
         one — the icon is a door, not a mirror. Both SVGs ship in the button
         and the active theme hides its own. */
      .theme { display: inline-flex; align-items: center; padding: 5px 8px; }
      .theme svg { display: block; }
      :root[data-theme='dark'] .theme__moon { display: none; }
      :root[data-theme='light'] .theme__sun { display: none; }

      /* A dead source is not a footnote — the table silently loses a whole
         group when a service is down, so the reason has to be on screen. */
      .err {
        margin-bottom: 12px;
        padding: 9px 14px;
        border: 1px solid var(--danger-line);
        border-radius: var(--r-sm);
        background: var(--danger-soft);
        color: var(--danger);
        font: 500 12px/1.5 var(--font-ui);
      }

      /* ── Table shell ──────────────────────────────────────────────────────
         One raised panel on the dark ground; a 1px hairline does the work a
         shadow cannot do here. No inner scroll box: the table grows to its
         full height and the PAGE is the only thing that scrolls — a container
         that scrolls inside a page that also scrolls gives two scrollbars and
         a header that hides rows behind itself. Sticky anchors to the
         viewport instead. */
      .t-wrap {
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--bg-raised);
        /* In light the white panel needs a whisper of lift off the ground;
           in dark the token is none — see its definition. */
        box-shadow: var(--shadow-card);
      }
      table {
        width: 100%;
        /* Fixed layout is what makes the hierarchy hold: the seven supporting
           columns take exactly the width they need, and Запит takes everything
           left over — instead of the single longest cell in the log deciding
           the shape of the whole table. */
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 12.5px;
      }

      th {
        position: sticky;
        top: 0;
        z-index: var(--z-sticky);
        padding: 8px 10px;
        /* Opaque on purpose: the header rides over scrolling rows. */
        background: var(--bg-raised);
        border-bottom: 1px solid var(--line-strong);
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
        color: var(--muted);
        font: 600 10.5px/1.4 var(--font-ui);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        user-select: none;
        transition: color var(--dur-fast) var(--ease-out);
      }
      /* The panel's top corners are rounded; the header must not clip them
         with square opaque corners while at rest. */
      th:first-child { border-top-left-radius: 7px; }
      th:last-child { border-top-right-radius: 7px; }
      /* Scrolled: the header is floating over rows, and a floating surface
         casts. The .is-stuck class comes from a passive scroll listener —
         CSS alone cannot know that sticky has engaged. */
      .t-wrap.is-stuck th { box-shadow: var(--shadow-stuck); }
      th:hover { color: var(--ink-2); }
      /* The sorted column is simply the brightest header — on a monochrome
         page, white IS the accent. */
      th.is-sorted { color: var(--ink); }
      th:focus-visible { outline: none; color: var(--ink); box-shadow: var(--ring); }
      /* The indicator always holds its slot, so sorting a column never shoves
         the header text sideways. */
      .ind {
        display: inline-block;
        width: 10px;
        margin-left: 4px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0;
      }

      .col--num    { width: 58px; }
      .col--status { width: 40px; }
      .col--time   { width: 78px; }
      .col--dur    { width: 64px; text-align: right; }
      .col--lane   { width: 68px; }
      .col--did    { width: 56px; }
      .col--redo   { width: 84px; }
      /* req carries no width on purpose — see table-layout above. */

      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        color: var(--ink-2);
      }
      /* First and last columns breathe against the panel edge — 10px against
         a rounded border reads as touching. Headers follow, so the columns
         stay plumb. */
      td:first-child, th:first-child { padding-left: 14px; }
      td:last-child, th:last-child { padding-right: 14px; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr { cursor: pointer; }
      /* Rows are keyboard targets too (tabindex in the template); the ring
         draws INSET because an outset ring between hairline-separated rows
         is swallowed by the neighbours. */
      tbody tr:focus-visible { outline: none; box-shadow: inset 0 0 0 1.5px oklch(0.72 0.13 245 / 0.75); }
      :root[data-theme='light'] tbody tr:focus-visible { box-shadow: inset 0 0 0 1.5px oklch(0.55 0.15 245 / 0.6); }
      /* The row currently open in the drawer keeps a marker, so coming back
         from the preview lands the eye where it left. Ephemeral by design:
         cleared on close, and renders pause while the drawer is open. */
      tbody tr.is-current td { background: var(--bg-hover); }
      /* Hover, not zebra. The old light theme banded even rows because eight
         columns were hard to track across a flat white field — but on this
         ground the hairlines are visible enough to carry the rows, banding
         would cost half the surface calm, and every row here is CLICKABLE:
         the hover fill is not decoration, it is the affordance that says so,
         and it tracks the row you are reading across all eight columns. */
      tbody tr:hover td { background: var(--row-hover); }
      /* The two states that are not at rest tint their whole row, so they are
         findable without reading — and they win over the hover fill. */
      tbody tr.is-wip td  { background: var(--info-soft); }
      tbody tr.is-redo td { background: var(--danger-soft); }

      /* RUNNING rows breathe: a soft sheen sweeps the full ribbon while an
         agent actually works — «В роботі», and the open rework iteration.
         The gradient lives on the TR (one band across the row, not eight
         restarts per cell) with the cells cleared to let it through; the
         parent of a redo thread keeps its static tint — it is waiting, its
         open iteration is the thing running. 3.2s and ~2× the resting tint
         at peak: visible in the corner of the eye, not a strobe. */
      tbody tr.is-wip,
      tbody tr.sub.is-redo {
        background-size: 200% 100%;
        animation: row-sheen 3.2s linear infinite;
      }
      tbody tr.is-wip {
        background-image: linear-gradient(100deg,
          var(--info-soft) 38%, var(--info-sheen) 50%, var(--info-soft) 62%);
      }
      tbody tr.sub.is-redo {
        background-image: linear-gradient(100deg,
          var(--danger-soft) 38%, var(--danger-sheen) 50%, var(--danger-soft) 62%);
      }
      tbody tr.is-wip td,
      tbody tr.sub.is-redo td { background: transparent; }
      @keyframes row-sheen {
        from { background-position: 160% 0 }
        to   { background-position: -60% 0 }
      }

      td.empty {
        padding: 48px 24px;
        text-align: center;
        color: var(--muted);
        border: 0;
        background: none;
        cursor: default;
      }
      td.empty b { display: block; margin-bottom: 4px; color: var(--ink-2); font-weight: 600; }
      td.empty span { font-size: 12px; }

      /* ── Panels ───────────────────────────────────────────────────────────
         THE table design of this page, in both modes: a slab with a title bar
         on the inset ground, real air between slabs, and no thead of its own —
         the shared column-header strip above owns sorting for all of them.
         Ungrouped there is one such slab («Усі правки»); «За сторінками»
         cuts the same rows into one slab per route. */
      .groups { display: flex; flex-direction: column; gap: 18px; }
      .groups[hidden] { display: none; }
      .ghead { margin-bottom: 18px; }
      .pnl {
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--bg-raised);
        box-shadow: var(--shadow-card);
        /* Row hover fill and tints must not poke past the radius. */
        overflow: hidden;
      }
      .pnl__head {
        display: flex;
        align-items: center;
        padding: 8px 14px;
        background: var(--bg-inset);
        border-bottom: 1px solid var(--line-strong);
      }
      .grp__route {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        border-radius: var(--r-xs);
        background: none;
        color: var(--ink-2);
        font: 500 11px/1.5 var(--font-mono);
        cursor: pointer;
        transition: color var(--dur-fast) var(--ease-out);
      }
      .grp__route:hover { color: var(--ink); text-decoration: underline; }
      .grp__route:focus-visible { outline: none; box-shadow: var(--ring); color: var(--ink); }
      .grp__route svg { flex: none; color: var(--muted); }
      /* «інше» is a bucket, not a screen: no glyph, no link, quieter ink. */
      .grp__route--plain { color: var(--muted); cursor: default; }
      .grp__route--plain:hover { color: var(--muted); text-decoration: none; }
      .grp__n { margin-left: 8px; color: var(--muted); font: 400 11px/1.5 var(--font-mono); }

      /* ── Index & supporting data ──────────────────────────────────────────
         `#`, time and duration are machine values: mono, muted, digits lined
         up down the column, never competing with the request. */
      td.idx, td.tab {
        white-space: nowrap;
        color: var(--muted);
        font-family: var(--font-mono);
        /* 19px matches the request's first line (13px × 1.45), so the mono
           index data and the prose sit on one optical baseline instead of
           the mono drifting a pixel high. */
        font-size: 11.5px;
        line-height: 19px;
      }
      /* Durations right-align under their right-aligned header: magnitudes
         compare by their ends, ids and clock times by their starts. */
      td.tab--r { text-align: right; }
      .muted { color: var(--muted); }

      /* ── Status ───────────────────────────────────────────────────────────
         Dot + word, no chip. Four tinted pills meant four coloured boxes per
         row competing with the prose that carries the actual meaning; the dot
         says the same thing in a sixth of the ink. */
      /* Icon-only: the word lives in title/aria-label, the tally above is
         the visual legend. A lone dot gets two extra pixels — solo it has to
         be findable, in a row it only had to be countable. */
      .st {
        display: inline-flex;
        align-items: center;
        min-height: 19px; /* one optical baseline with .req and .tab */
        color: var(--ink-2);
      }
      .st--redo { color: var(--danger); }
      .st .dot { width: 8px; height: 8px; }
      .dot {
        flex: 0 0 auto;
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--faint);
      }
      /* Нова and В роботі share the blue — both mean "incoming attention",
         and the spinner-vs-circle shape difference already separates them. */
      /* Icon system: Solar bold-duotone — the same iconify set the app
         itself uses — inlined at build time from api.iconify.design, because
         this page must never fetch at runtime. Solar's own grammar carries
         the duotone (fill currentColor + an opacity-.5 secondary layer), so
         the theme tokens recolour both layers for free. Status dots keep the
         matching idea as core + soft halo of their hue; the two brand marks
         in the Агент column are the official logos from simple-icons, not
         UI icons — see LANE_IC. */
      .dot--new  { background: var(--info); box-shadow: 0 0 0 3px var(--info-soft); }
      /* The only ambient motion in the table, and only on the two states that
         are genuinely changing while you look at them: opacity, slowly. */
      .dot--wip  { background: var(--info);   box-shadow: 0 0 0 3px var(--info-soft);   animation: beat 1.6s ease-in-out infinite; }
      .dot--redo { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); animation: beat 1.6s ease-in-out infinite; }
      /* Зроблено is a CHECKBOX, not a dot: the resting state stays neutral
         ink, but the glyph says "closed" instead of merely "present". Shared
         by the status column and the tally legend via stMark(). */
      .ok-ic { flex: none; color: var(--muted); }
      @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

      /* A spinner, not a pulse: «В роботі» means an agent is running right
         now, and rotation is the one motion that reads as "still going"
         rather than "look here". */
      .elapsed { color: var(--info); font-family: var(--font-mono); font-size: 11.5px; }
      tr.is-redo .elapsed { color: var(--danger); }
      .spin { flex: none; animation: spin 900ms linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      /* ── Agent lane ───────────────────────────────────────────────────────
         The vocabulary is tiny and closed («сам», «agent», «opencode»,
         «agent + impeccable»), so the cell shows MARKS, not words: the
         official Claude and opencode logos (see LANE_IC for provenance) —
         Claude's turns brand-orange when impeccable joined — and the Solar
         user icon for hand-made fixes. The full name lives in title/aria-label.
         opencode is cyan, impeccable orange; the rest stay quiet ink.
         A name outside the vocabulary falls back to mono text — an icon
         system must never eat an identity it does not recognise. */
      .lane {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 19px; /* one optical baseline with .req and .tab */
        white-space: nowrap;
        color: var(--muted);
        font: 400 11px/1.4 var(--font-mono);
      }
      .lane svg { display: block; }
      .lane--opencode { color: var(--lane-op); }
      /* impeccable has no logo of its own — the tell is Claude's mark in
         Claude's brand orange; plain agent work keeps the mark in muted ink. */
      .lane--imp { color: var(--lane-imp); }

      /* ── The request ──────────────────────────────────────────────────────
         The real decision on this page. Requests run from four words to ten
         lines; left alone they make every row a different height and the table
         stops being scannable at all.

         So: three lines, hard. That is roughly the height of a short row
         anyway, so the table gets one rhythm — and nothing is lost, because
         the full text is the subject line of the Деталі dialog, the drawer's
         own title, and the cell's tooltip. A log whose rows are all different
         heights is not a table, it is a stack of paragraphs with rules between
         them. */
      .req {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        overflow: hidden;
        overflow-wrap: anywhere;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
      }
      .req code {
        padding: 1px 4px;
        border: 1px solid var(--line);
        border-radius: var(--r-xs);
        background: var(--bg-inset);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 0.88em;
      }
      .req strong { font-weight: 600; }

      /* ── Row controls ─────────────────────────────────────────────────────
         Деталі and the send-back share one vocabulary: bare glyph buttons of
         the same size, no border, no fill, resting one step above invisible.
         They are inputs sitting in a data row, and the row is read far more
         often than it is acted on. */
      .icon-btn {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        /* A resting hairline box: the difference between "a glyph that
           happens to sit here" and "a control you may press". Hover fills
           the box, so approach reads as depression, not just recolour. */
        border: 1px solid var(--line);
        border-radius: var(--r-xs);
        background: none;
        cursor: pointer;
        font-style: normal;
        transition: color var(--dur-fast) var(--ease-out),
                    border-color var(--dur-fast) var(--ease-out),
                    background-color var(--dur-fast) var(--ease-out);
      }
      .icon-btn:hover { border-color: var(--line-strong); background: var(--bg-hover); }
      /* One glyph size for every 20px button — the SVG strings carry their
         own width/height, this overrides them all so Деталі, send-back,
         pause, play and delete weigh the same in a row. */
      .icon-btn svg { width: 14px; height: 14px; }
      .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); }

      /* The id is what the user quotes back when a fix is wrong, so it must
         be selectable and complete — truncated with the full value in the
         tooltip, never abbreviated away. */
      .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
      .redo, .info, .dr__nav, .dr__x { display: inline-flex; align-items: center; justify-content: center; }
      .info { color: var(--muted); }
      .info:hover, .info:focus-visible { color: var(--ink); }
      .info--redo { color: var(--danger); }

      /* Send-back. Quiet by default — it is the exception, not the expected
         action — and only turns danger-coloured on approach, or for good once
         a rework is actually outstanding. */
      .redo { color: var(--faint); }
      .redo:hover, .redo:focus-visible { color: var(--danger); }
      .redo--on { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }

      /* The Доробки cell: the send-back glyph plus, once a thread exists, its
         iteration count in mono — a number, not a badge, like everything else
         the machine counts on this page. */
      .rw { display: inline-flex; align-items: center; gap: 6px; }
      .rw-n { color: var(--muted); font: 500 11px/1 var(--font-mono); }

      /* Pre-work actions (pause / resume / delete on «Нова» and «На паузі»).
         Hidden until the row is hovered or the control focused: they are the
         rarest inputs on the page and thirty rows of pause glyphs would be
         noise. Keyboard users get them via :focus-within, no hover needed. */
      .acts { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
      tbody tr:hover .acts, .acts:focus-within { opacity: 1; }
      .act { color: var(--muted); }
      .act:hover { color: var(--ink); }
      .act--del:hover { color: var(--danger); }
      /* Armed = one click from gone. Loud on purpose, and self-disarms. */
      .act--del.is-armed { opacity: 1; color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }

      /* A paused row rests: its request drops to muted ink so the eye slides
         past it the way it slides past done rows, but the pause mark in the
         status column still says why. */
      tbody tr.is-paused .req { color: var(--muted); }

      /* ── Rework thread ────────────────────────────────────────────────────
         Child rows hung under a sent-back fix, one per iteration. The branch
         glyph (├ └) sits in the # column — mono, quiet, exactly where a tree
         would draw its trunk — and the note occupies the request column: the
         note IS the request of its iteration. Closed iterations rest on the
         inset surface so the thread reads as carved into the log rather than
         stacked on top of it; an open iteration keeps the danger tint and so
         fuses visually with its tinted parent into one red block. */
      tbody tr.sub td {
        background: var(--bg-inset);
        /* A notch denser than data rows: iterations are commentary on the
           row above, and the tighter leading binds the thread to it. */
        padding-top: 5px;
        padding-bottom: 5px;
      }
      .sub__b { color: var(--faint); user-select: none; }
      .sub__id { color: var(--muted); user-select: all; /* quotable, like .id */ }
      tr.is-redo .sub__b { color: var(--danger); }
      .sub .req { font-size: 12.5px; color: var(--ink-2); }
      .st--fixed { color: var(--muted); font-weight: 400; }
      /* Green only here: a closed rework is the one place "fixed" is news. */
      .dot--fixed { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }

      /* ── Drawer ───────────────────────────────────────────────────────────
         Composed as three zones instead of seven loose siblings:
           left   — walking the list (‹ › + position), one control group;
           middle — what you are looking at (the request);
           right  — what you can do about it (verdict, then open / close),
                    fenced off by a hairline so actions never read as content.
         The panel keeps the page's dark chrome, but its border-left is the
         real edge — a drop shadow alone disappears against the dark scrim. */
      .dr { position: fixed; inset: 0; z-index: var(--z-drawer); }
      .dr__scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        animation: scrim-in var(--dur) var(--ease-out) both;
      }
      .dr__panel {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 92%;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--line-strong);
        background: var(--bg-raised);
        box-shadow: var(--shadow-drawer);
        animation: panel-in 280ms var(--ease-out) both;
      }
      @keyframes scrim-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes panel-in {
        from { opacity: 0; transform: translateX(24px) }
        to   { opacity: 1; transform: translateX(0) }
      }

      .dr__head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
      }
      .dr__group { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      .dr__navs { display: flex; gap: 2px; }
      .dr__nav, .dr__x {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: none;
        color: var(--muted);
        cursor: pointer;
        transition: color var(--dur-fast) var(--ease-out),
                    background-color var(--dur-fast) var(--ease-out);
      }
      .dr__nav:hover:not([disabled]), .dr__x:hover { color: var(--ink); background: var(--bg-hover); }
      .dr__nav:focus-visible, .dr__x:focus-visible { outline: none; box-shadow: var(--ring); }
      .dr__nav[disabled] { opacity: .35; cursor: default; }
      .dr__pos {
        flex: 0 0 auto;
        color: var(--muted);
        font: 500 11px/1 var(--font-mono);
      }

      /* The request is the one thing worth reading in this header, so it
         takes the centre and the controls sit either side of it. */
      .dr__title { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; text-align: center; }
      .dr__name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink);
        font: 500 13px/1.4 var(--font-ui);
      }

      /* In the drawer the send-back is the task, not a control that happens
         to sit in a table cell — so it is a size up and carries a plain
         sentence-case label instead of a tracked-out all-caps one. */
      .dr__rate { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      .dr__rate-label {
        color: var(--muted);
        font: 500 11px/1 var(--font-ui);
      }
      .dr__rate .redo { width: 24px; height: 24px; }

      .dr__actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
        padding-left: 14px;
        border-left: 1px solid var(--line);
      }
      .dr__open {
        white-space: nowrap;
        color: var(--info);
        font: 500 12px/1 var(--font-ui);
        text-decoration: none;
      }
      .dr__open:hover, .dr__open:focus-visible { outline: none; text-decoration: underline; }
      /* The frame hosts the LIGHT app: a white ground under it means loading
         is a white flash into a white page, not a dark hole into a white one. */
      .dr__frame { flex: 1 1 auto; width: 100%; border: 0; background: oklch(1 0 0); }

      /* ── Dialog ───────────────────────────────────────────────────────────
         Two modes, one box: reading what a fix did, and telling it to be done
         again. A note here is not a comment on a finished thing — it is an
         instruction — so it is a deliberate act behind a button rather than a
         field sitting in every row. */
      .pop {
        position: fixed;
        inset: 0;
        z-index: var(--z-modal);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .pop__scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        animation: scrim-in var(--dur) var(--ease-out) both;
      }
      .pop__box {
        position: relative;
        width: min(560px, 100%);
        padding: 20px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-lg);
        background: var(--bg-raised);
        box-shadow: var(--shadow-pop);
        animation: pop-in var(--dur) var(--ease-out) both;
      }
      @keyframes pop-in {
        from { opacity: 0; transform: scale(.97) }
        to   { opacity: 1; transform: scale(1) }
      }
      .pop__title {
        display: block;
        margin: 0 0 4px;
        color: var(--ink);
        font: 600 15px/1.35 var(--font-ui);
        letter-spacing: -0.01em;
      }
      /* The subject line doubles as the full request — the table clamps it to
         three lines, this is where it is read whole. */
      .pop__sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .pop__body {
        margin: 0 0 14px;
        max-height: 60vh;
        overflow-y: auto;
        color: var(--ink-2);
        font-size: 13px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .pop__body code {
        padding: 1px 4px;
        border: 1px solid var(--line);
        border-radius: var(--r-xs);
        background: var(--bg-inset);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: .88em;
      }
      /* One block per iteration in the Деталі dialog: the reviewer's note,
         then (once closed) what the redo changed, split by a hairline. The
         open iteration is the only tinted one — it is the thing still owed. */
      .pop__it {
        margin: 0 0 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--bg-inset);
        font-size: 12.5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .pop__it--open { border-color: var(--danger-line); background: var(--danger-soft); }
      .pop__it-head { margin-bottom: 4px; color: var(--muted); font: 500 10.5px/1.5 var(--font-mono); }
      .pop__it--open .pop__it-head { color: var(--danger); }
      .pop__it-res { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--ink-2); }

      .pop__note {
        display: block;
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        background: var(--bg-inset);
        color: var(--ink);
        font: 400 13px/1.5 var(--font-ui);
        resize: vertical;
      }
      .pop__note::placeholder { color: var(--muted); }
      .pop__note:hover { border-color: var(--line-hover); }
      .pop__note:focus { outline: none; box-shadow: var(--ring); border-color: transparent; }
      .pop__foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
      .pop__err { flex: 1 1 auto; color: var(--danger); font: 500 12px/1.4 var(--font-ui); }
      .pop__cancel, .pop__send {
        flex: 0 0 auto;
        padding: 6px 14px;
        border-radius: var(--r-sm);
        font: 500 12.5px/1.4 var(--font-ui);
        cursor: pointer;
        transition: color var(--dur-fast) var(--ease-out),
                    border-color var(--dur-fast) var(--ease-out),
                    background-color var(--dur-fast) var(--ease-out);
      }
      .pop__cancel { border: 1px solid var(--line-strong); background: none; color: var(--ink-2); }
      .pop__cancel:hover { background: var(--bg-hover); color: var(--ink); }
      /* The one filled button on the page — primary is ink-coloured; the
         text borrows the panel surface so it flips with the theme for free. */
      .pop__send { border: 1px solid transparent; background: var(--ink); color: var(--bg-raised); }
      .pop__send:hover { background: var(--btn-primary-hover); }
      .pop__cancel:focus-visible, .pop__send:focus-visible { outline: none; box-shadow: var(--ring); }
      .pop__send[disabled] { opacity: .5; cursor: default; }

      @media (prefers-reduced-motion: reduce) {
        .dot--wip, .dot--redo { animation: none }
        /* Sheen collapses to the plain resting tint. */
        tbody tr.is-wip, tbody tr.sub.is-redo {
          animation: none;
          background-image: none;
        }
        tbody tr.is-wip td { background: var(--info-soft) }
        tbody tr.sub.is-redo td { background: var(--danger-soft) }
        .dr__panel, .dr__scrim, .pop__scrim, .pop__box { animation: none }
        .icon-btn, .reload, .dr__nav, .dr__x, .pop__cancel, .pop__send, th { transition: none }
      }

      @media (max-width: 720px) {
        body { padding: 14px 14px 24px; }
        h1 { font-size: 15px; }
        .dr__rate-label { display: none; }
      }
      /* Below ~640px the fixed columns would starve Запит — the page's whole
         point. Трив. (4) and Агент (6) are the most expendable index data;
         both remain one click away in Деталі. nth-child is safe here: group
         headers and the empty state are single-cell colspan rows. */
      @media (max-width: 640px) {
        th:nth-child(4), td:nth-child(4),
        th:nth-child(6), td:nth-child(6) { display: none; }
        col.col--dur, col.col--lane { width: 0; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <img class="brand" src="/favicon.svg" alt="Куток" />
        <h1>Fix log</h1>
        <div class="tally" id="count"></div>
        <div class="head__actions">
          <button class="reload reload--quiet theme" id="theme" type="button"
            aria-label="Перемкнути тему" title="Тема">
            <svg class="theme__sun" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M18 12a6 6 0 1 1-12 0a6 6 0 0 1 12 0"/><path fill-rule="evenodd" d="M12 1.25a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0V2a.75.75 0 0 1 .75-.75M1.25 12a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5H2a.75.75 0 0 1-.75-.75m19 0a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5h-1a.75.75 0 0 1-.75-.75M12 20.25a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1a.75.75 0 0 1 .75-.75" clip-rule="evenodd"/><path d="M4.398 4.398a.75.75 0 0 1 1.061 0l.393.393a.75.75 0 0 1-1.06 1.06l-.394-.392a.75.75 0 0 1 0-1.06m15.202 0a.75.75 0 0 1 0 1.06l-.392.393a.75.75 0 0 1-1.06-1.06l.392-.393a.75.75 0 0 1 1.06 0m-1.453 13.748a.75.75 0 0 1 1.061 0l.393.393a.75.75 0 0 1-1.06 1.06l-.394-.392a.75.75 0 0 1 0-1.06m-12.295 0a.75.75 0 0 1 0 1.06l-.393.393a.75.75 0 1 1-1.06-1.06l.392-.393a.75.75 0 0 1 1.06 0" opacity=".5"/></g></svg>
            <svg class="theme__moon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path fill-rule="evenodd" d="M22 12c0 5.523-4.477 10-10 10a10 10 0 0 1-3.321-.564A9 9 0 0 1 8 18a8.97 8.97 0 0 1 2.138-5.824A6.5 6.5 0 0 0 15.5 15a6.5 6.5 0 0 0 5.567-3.143c.24-.396.933-.32.933.143" clip-rule="evenodd" opacity=".5"/><path d="M2 12c0 4.359 2.789 8.066 6.679 9.435A9 9 0 0 1 8 18c0-2.221.805-4.254 2.138-5.824A6.47 6.47 0 0 1 9 8.5a6.5 6.5 0 0 1 3.143-5.567C12.54 2.693 12.463 2 12 2C6.477 2 2 6.477 2 12"/></g></svg>
          </button>
          <div class="seg" role="group" aria-label="Як групувати правки">
            <button class="seg__b" id="segAll" type="button" aria-pressed="true"
              title="Смуги за давністю">Всі</button>
            <button class="seg__b" id="segPages" type="button" aria-pressed="false"
              title="Панель на кожен роут">По сторінках</button>
          </div>
        </div>
      </div>
      <div id="warn"></div>
      <div id="note"></div>
      <!-- ONE table design, in both modes. The page used to carry two: a flat
           table whose thead sat inside its own shell, and a separate strip of
           route panels — same columns, same rows, two different slabs, and
           the eye had to re-learn the grid every time the toggle flipped.
           Now the sticky column header is always this strip, and the rows
           always live in .pnl panels under it: «За сторінками» merely decides
           whether that is ONE panel («Усі правки») or one per route. Every
           table here is table-layout:fixed with the same col-- widths, so the
           columns line up across panels by construction. -->
      <div class="t-wrap ghead" id="gheadWrap">
        <table>
          <thead>
            <tr id="gthead"></tr>
          </thead>
        </table>
      </div>
      <div class="groups" id="groups"></div>
    </div>

    <!-- Row click opens the annotated screen itself, in a drawer over the log.
         An iframe rather than a new tab: the point is to glance at the screen
         and come straight back to the row you were rating. -->
    <div class="dr" id="dr" hidden>
      <div class="dr__scrim" id="drScrim"></div>
      <aside class="dr__panel" role="dialog" aria-modal="true" aria-labelledby="drTitle">
        <header class="dr__head">
          <div class="dr__group">

              <button class="dr__nav" id="drNext" type="button" aria-label="Наступна правка" title="Наступна (→)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m12.404 8.303l3.431 3.327c.22.213.22.527 0 .74l-6.63 6.43C8.79 19.201 8 18.958 8 18.43v-5.723z"/><path d="M8 11.293V5.57c0-.528.79-.771 1.205-.37l2.481 2.406z" opacity=".5"/></g></svg></button>

              title="Відправити на доробку" aria-label="Відправити на доробку"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path fill-rule="evenodd" d="M6.873 7.873a7.25 7.25 0 0 1 7.928-1.563l1.13-1.13a8.75 8.75 0 1 0 4.751 6.727a.75.75 0 0 0-1.488.187a7.25 7.25 0 1 1-12.32-4.22" clip-rule="evenodd" opacity=".5"/><path d="M18.721 4.201a.75.75 0 0 0-1.28-.53l-1.51 1.51l-1.13 1.13l-1.603 1.603a.75.75 0 0 0 .53 1.28h4.243a.75.75 0 0 0 .75-.75z"/></g></svg></button>

            <button class="dr__x" id="drClose" type="button" aria-label="Закрити"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2s10 4.477 10 10" opacity=".5"/><path d="M8.97 8.97a.75.75 0 0 1 1.06 0L12 10.94l1.97-1.97a.75.75 0 1 1 1.06 1.06L13.06 12l1.97 1.97a.75.75 0 0 1-1.06 1.06L12 13.06l-1.97 1.97a.75.75 0 0 1-1.06-1.06L10.94 12l-1.97-1.97a.75.75 0 0 1 0-1.06"/></g></svg></button>

    <!-- One dialog, two modes: reading what a fix did, and sending it back. -->
    <div class="pop" id="pop" hidden>
      <div class="pop__scrim" id="popScrim"></div>
      <div class="pop__box" role="dialog" aria-modal="true" aria-labelledby="popTitle">
        <h2 class="pop__title" id="popTitle">На доробку</h2>
        <p class="pop__sub" id="popSub"></p>
        <div class="pop__body" id="popBody" hidden></div>
        <textarea class="pop__note" id="popNote" rows="4" maxlength="500"
          aria-label="Що не так і як має бути"
          placeholder="Що не так і як має бути"></textarea>
        <div class="pop__foot">
          <span class="pop__err" id="popErr"></span>
          <button class="pop__cancel" id="popCancel" type="button">Скасувати</button>
          <button class="pop__send" id="popSend" type="button">Відправити</button>
        </div>
      </div>
    </div>

    <script>
      /* ────────────────────────────────────────────────────────────────────
         Zero libraries on purpose. The page is served by the local dev server
         and is regularly opened from a LAN machine that may have no internet
         at all, so a CDN import would be a page that sometimes just fails.
         The markdown it has to read is a known, narrow subset (h2/h3, tables,
         `code`, **bold**) — forty lines of parser beats a dependency.

         Hosts are derived from location.hostname, never hardcoded: this page
         is normally opened as http://192.168.31.21:5273/fixlog.html from
         ANOTHER machine, where "localhost" would mean that machine's own
         loopback and every fetch would fail.
         ──────────────────────────────────────────────────────────────────── */
      const ANN = `http://${location.hostname}:4747`   // annotations (open work)
      const RATE = `http://${location.hostname}:4748`  // ratings (verdicts)

      const $ = (id) => document.getElementById(id)

      /* A blank page is the worst failure mode for a dashboard: it looks like
         "no data" when it is really "the script died". Anything uncaught lands
         in the warning strip instead. */
      const fatal = (msg) => {
        const el = document.getElementById('warn')
        if (el) el.innerHTML = `<div class="err">Помилка сторінки: ${String(msg)}</div>`
      }
      window.addEventListener('error', (e) => fatal(e.message))
      window.addEventListener('unhandledrejection', (e) => fatal(e.reason && e.reason.message || e.reason))

      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

      const inline = (s) =>
        esc(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')

      /* Markdown decoration stripped, for values used as data (route text,
         lane vocabulary, rating keys) rather than rendered prose. */
      const plain = (s) => String(s).replace(/[`*]/g, '').trim()

      /* Lane marks. The two brands are the OFFICIAL logos, inlined verbatim
         from simple-icons (simple-icons/claude — Anthropic's Claude starburst;
         simple-icons/opencode — their blocky «o»), original 24-unit viewBox
         and paths untouched, monochrome by origin so currentColor recolours
         them per theme. impeccable ships no logo (checked its skill package),
         so it is never given a fake one: «agent + impeccable» is Claude's
         mark wearing Claude's brand orange (--lane-imp). «сам» is a person,
         not a brand — the Solar user icon like the rest of the UI set. */
      const LANE_IC = {
        claude: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="m4.714 15.956l4.718-2.648l.079-.23l-.08-.128h-.23l-.79-.048l-2.695-.073l-2.337-.097l-2.265-.122l-.57-.121l-.535-.704l.055-.353l.48-.321l.685.06l1.518.104l2.277.157l1.651.098l2.447.255h.389l.054-.158l-.133-.097l-.103-.098l-2.356-1.596l-2.55-1.688l-1.336-.972l-.722-.491L2 6.223l-.158-1.008l.656-.722l.88.06l.224.061l.893.686l1.906 1.476l2.49 1.833l.364.304l.146-.104l.018-.072l-.164-.274l-1.354-2.446l-1.445-2.49l-.644-1.032l-.17-.619a3 3 0 0 1-.103-.729L6.287.133L6.7 0l.995.134l.42.364l.619 1.415L9.735 4.14l1.555 3.03l.455.898l.243.832l.09.255h.159V9.01l.127-1.706l.237-2.095l.23-2.695l.08-.76l.376-.91l.747-.492l.583.28l.48.685l-.067.444l-.286 1.851l-.558 2.903l-.365 1.942h.213l.243-.242l.983-1.306l1.652-2.064l.728-.82l.85-.904l.547-.431h1.032l.759 1.129l-.34 1.166l-1.063 1.347l-.88 1.142l-1.263 1.7l-.79 1.36l.074.11l.188-.02l2.853-.606l1.542-.28l1.84-.315l.832.388l.09.395l-.327.807l-1.967.486l-2.307.462l-3.436.813l-.043.03l.049.061l1.548.146l.662.036h1.62l3.018.225l.79.522l.473.638l-.08.485l-1.213.62l-1.64-.389l-3.825-.91l-1.31-.329h-.183v.11l1.093 1.068l2.003 1.81l2.508 2.33l.127.578l-.321.455l-.34-.049l-2.204-1.657l-.85-.747l-1.925-1.62h-.127v.17l.443.649l2.343 3.521l.122 1.08l-.17.353l-.607.213l-.668-.122l-1.372-1.924l-1.415-2.168l-1.141-1.943l-.14.08l-.674 7.254l-.316.37l-.728.28l-.607-.461l-.322-.747l.322-1.476l.388-1.924l.316-1.53l.285-1.9l.17-.632l-.012-.042l-.14.018l-1.432 1.967l-2.18 2.945l-1.724 1.845l-.413.164l-.716-.37l.066-.662l.401-.589l2.386-3.036l1.439-1.882l.929-1.086l-.006-.158h-.055L4.138 18.56l-1.13.146l-.485-.456l.06-.746l.231-.243l1.907-1.312Z"/></svg>',
        opencode: '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M22 24H2V0h20zM17 4.8H7v14.4h10z"/></svg>',
        self: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="6" r="4"/><path d="M20 17.5c0 2.485 0 4.5-8 4.5s-8-2.015-8-4.5S7.582 13 12 13s8 2.015 8 4.5" opacity=".5"/></g></svg>',
      }

      const lane = (raw) => {
        const t = plain(raw)
        if (!t) return '<span class="muted">—</span>'
        const icons = []
        if (/opencode/i.test(t)) icons.push(LANE_IC.opencode)
        else if (/сам/i.test(t)) icons.push(LANE_IC.self)
        /* Назва моделі — це не інформація в цьому стовпчику: колонка каже,
           ХТО робив правку, а всі вони Claude. «opus», «sonnet», «haiku»,
           «fable» друкувалися словом лише тому, що словника їм не завели —
           і одна модель виглядала інакше за іншу без жодної причини.
           Тепер будь-яка з них — той самий знак; точна назва лишається в
           title, бо в лозі вона записана і за нею шукають. */
        else if (/agent|claude|impeccable|opus|sonnet|haiku|fable|anthropic/i.test(t))
          icons.push(LANE_IC.claude)
        /* Outside the vocabulary → the name itself, readable, never an
           unexplained blank. */
        if (!icons.length) return `<span class="lane" title="${esc(t)}">${esc(t)}</span>`
        const kind = /opencode/i.test(t) ? 'opencode' : /impeccable/i.test(t) ? 'imp' : 'agent'
        return `<span class="lane lane--${kind}" role="img" title="${esc(t)}" aria-label="${esc(t)}">${icons.join('')}</span>`
      }

      /* «3хв тому» замість «15:32». Абсолютний час у цій таблиці ніколи не
         був питанням — питання завжди «наскільки це свіже»; годинник змушував
         рахувати різницю в голові. Точний час лишається в title комірки, бо
         саме ним рядок цитують у fixlog.md. Оновлюється тим же 1-секундним
         тикером, що й лічильник роботи: «щойно», яке лишається «щойно» через
         пів години, — брехня. */
      const ago = (ms) => {
        const sec = Math.round((Date.now() - ms) / 1000)
        if (!ms || Number.isNaN(sec)) return ''
        if (sec < 60) return 'щойно'         // від'ємне теж: годинник машини стрибнув
        const m = Math.floor(sec / 60)
        if (m < 60) return `${m}хв`
        const h = Math.floor(m / 60)
        if (h < 24) return `${h}год`
        return `${Math.floor(h / 24)}д`
      }

      const hhmm = (ms) => {
        const d = new Date(ms)
        return Number.isNaN(d.getTime())
          ? ''
          : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
      }

      /* Annotations carry the full URL they were made on; only the path is
         worth showing, and a malformed one must not take the page down. */
      const routeOf = (url) => {
        try { return new URL(url).pathname } catch { return String(url || '—') }
      }

      const plural = (n, one, few, many) => {
        const m10 = n % 10, m100 = n % 100
        if (m10 === 1 && m100 !== 11) return one
        if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few
        return many
      }

      /* ── Sources ──────────────────────────────────────────────────────── */

      const getJSON = async (url) => {
        const r = await fetch(url, { cache: 'no-store' })
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      }

      /* Runs `fn` over `items` with a bounded number of in-flight requests.
         There are ~100 sessions and each is one round trip; firing them all at
         once is what makes a tiny zero-dependency server drop connections. */
      async function pool(items, limit, fn) {
        const out = new Array(items.length)
        let next = 0
        const worker = async () => {
          while (next < items.length) {
            const i = next++
            out[i] = await fn(items[i])
          }
        }
        await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker))
        return out
      }

      /* «Нова» + «В роботі» both come from the annotation server.

         There is no endpoint for "acknowledged", so В роботі is derived: walk
         every session, collect its annotations, and subtract the ids that
         /pending already reported. What remains is everything the server still
         holds that is no longer waiting to be picked up — acknowledged and
         resolved-but-not-yet-deleted alike. Deleting the annotation (the last
         step of the workflow, so the marker stops covering the mockup) is what
         moves a fix out of this group and into Зроблено. */
      async function loadOpen() {
        const pending = (await getJSON(`${ANN}/pending`)).annotations || []
        const pendingIds = new Set(pending.map((a) => a.id))

        const sessions = await getJSON(`${ANN}/sessions`)
        const perSession = await pool(sessions, 8, async (s) => {
          try { return (await getJSON(`${ANN}/sessions/${s.id}`)).annotations || [] }
          catch { return [] } // one dead session must not blank the whole group
        })

        /* Not-pending is NOT the same as in-progress. Since the workflow
           stopped deleting annotations and only resolves them, a finished fix
           keeps living on the server with status `resolved` — and treating
           "on the server but not pending" as «В роботі» left every completed
           fix stuck there forever. Read the status the server actually
           reports: `resolved` means done (the log already carries it, so it is
           dropped here), anything else that is not pending is genuinely
           acknowledged and being worked on. */
        const seen = new Set()
        const wip = []
        const paused = []
        let resolved = 0
        for (const a of perSession.flat()) {
          if (pendingIds.has(a.id) || seen.has(a.id)) continue
          seen.add(a.id)
          if (a.status === 'resolved' || a.resolvedAt) { resolved++; continue }
          /* Paused BY THIS PAGE: the status string is ours (the server
             stores any status verbatim; /pending filters on 'pending' in
             SQL, so the dispatcher never sees these). Without this branch a
             paused fix would masquerade as «В роботі». */
          if (a.status === 'paused') { paused.push(a); continue }
          wip.push(a)
        }
        return { pending, wip, paused, resolved }
      }

      /* ── Rating identity ───────────────────────────────────────────────
         Rows in fixlog.md have no id — it is a hand-written markdown table.
         The key is `${час}|${роут}` with markdown stripped, because that pair
         is what a human already treats as the row's name, it is stable across
         re-parses, and it stays readable inside the JSON file (a hash would
         make the store unreviewable by hand).

         The log is append-only, so a duplicate pair can only ever appear
         LATER than the row it duplicates. A repeat therefore gets a `#2`,
         `#3`… suffix by order of appearance: already-stored keys keep meaning
         exactly the row they were given for, and only the new collision needs
         a new one. Existing keys such as `11:4x|/search` are untouched. */
      const rowKey = (time, route, seenCounts) => {
        const base = `${plain(time)}|${plain(route)}`
        const n = (seenCounts[base] = (seenCounts[base] || 0) + 1)
        return n === 1 ? base : `${base}#${n}`
      }

      /* «Зроблено» — parsed out of fixlog.md. Columns are found by header name
         rather than position, so an extra column added later does not silently
         shift the route into the request. */
      function parseDone(md) {
        const lines = md.split('\n')
        const isRow = (l) => l.trim().startsWith('|')
        const cells = (l) =>
          l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim())

        const seenCounts = {}
        const out = []
        /* «те саме» in the route column means "the same screen as the row
           above" — log shorthand. Resolved here (carried forward), so the
           drawer and the route grouping get a real path. The RAW cell keeps
           feeding rowKey: rating keys like `10:2x|те саме` already live in
           fixlog-ratings.json and must never change meaning. */
        let prevRoute = ''
        /* Рядок лога несе тільки «15:32» — доба живе в заголовку секції
           «## 2026-08-12» вище. Без неї «3хв тому» рахувалося б від сьогодні
           для рядків усіх днів, і вчорашній лог виглядав би щойно зробленим. */
        let day = ''
        /* Розкладка колонок ЖИВЕ ДОВШЕ за суцільний блок рядків. Раніше
           парсер вимагав «шапка + роздільник» безпосередньо перед рядками і
           зупиняв таблицю на першому ж порожньому рядку — а порожній рядок
           з'являється щоразу, коли агент дописує свій рядок через `>>` після
           файлу без завершального \n. Півсотні найсвіжіших правок через це
           не доїжджали на сторінку взагалі: у лозі є, у таблиці немає. Тепер
           таблиця триває, доки не почалася нова шапка. */
        let map = null
        for (let i = 0; i < lines.length; i++) {
          const h = lines[i].match(/^##\s+(\d{4})-(\d{2})-(\d{2})/)
          if (h) { day = h.slice(1).map(Number); map = null; continue }
          if (!isRow(lines[i])) continue
          /* Шапка: рядок таблиці, під яким роздільник. */
          if (isRow(lines[i + 1] || '') && /^[\s|:-]+$/.test(lines[i + 1])) {
            const head = cells(lines[i]).map((c) => plain(c).toLowerCase())
            const col = (re) => head.findIndex((c) => re.test(c))
            map = {
              time: col(/^час$|^time$/),
              dur: col(/трив|роботи|duration|elapsed/),
              route: col(/роут|route|шлях/),
              req: col(/запит|request/),
              lane: col(/маршрут|lane/),
              did: col(/зроблено|результат|did/),
            }
            i++            // проковтнути роздільник
            continue
          }
          if (!map) continue
          const c = cells(lines[i])
          const pick = (k) => (map[k] >= 0 ? c[map[k]] || '' : '')
          const time = pick('time')
          const route = pick('route')
          const routePlain = plain(route)
          const resolved =
            /^те саме/i.test(routePlain) && prevRoute ? prevRoute : routePlain
          if (resolved.startsWith('/')) prevRoute = resolved
          const hm = plain(time).match(/(\d{1,2}):(\d{2})/)
          out.push({
            key: rowKey(time, route, seenCounts),
            time,
            /* 0, якщо час або доба нечитабельні (у лозі бувають «10:0x»
               і «10:2x» — навмисна неточність ранніх рядків). Тоді комірка
               показує текст як він написаний. */
            at: day && hm
              ? new Date(day[0], day[1] - 1, day[2], +hm[1], +hm[2]).getTime()
              : 0,
            route,
            routeRes: resolved,
            dur: pick('dur'),
            req: pick('req'),
            laneRaw: pick('lane'),
            did: pick('did'),
          })
        }
        return out
      }

      /* ── Render ───────────────────────────────────────────────────────── */

      /* One panel by default, not three grouped lists: the user scans across
         statuses ("what is still open, what did opencode do") far more often
         than within one. Sorting is therefore the grouping tool — click a
         header instead of being locked into someone else's sections. «За
         сторінками» only re-cuts the same panel per route; the design is the
         same slab either way. */
      const state = { ratings: {}, ratingsErr: '', rows: [], sort: 'fresh', dir: 1 }

      /* The drawer walks the list the user is actually looking at — the
         current sort order, not insertion order — so ‹ › match what the table
         shows above it. Refreshed on every render so a re-sort while the
         drawer is open does not desync the arrows. */
      let visible = []
      let cursor = -1


      /* Inline SVG, not text glyphs. A character like ★ or ⟳ is sized and
         aligned by the font — it shifts baseline, differs across systems and
         cannot take a stroke width. These are drawn, so they sit on the same
         optical grid everywhere. currentColor keeps every existing colour
         rule working unchanged. */
      const SVG = {
        pause: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M2 6c0-1.886 0-2.828.586-3.414S4.114 2 6 2s2.828 0 3.414.586S10 4.114 10 6v12c0 1.886 0 2.828-.586 3.414S7.886 22 6 22s-2.828 0-3.414-.586S2 19.886 2 18z"/><path d="M14 6c0-1.886 0-2.828.586-3.414S16.114 2 18 2s2.828 0 3.414.586S22 4.114 22 6v12c0 1.886 0 2.828-.586 3.414S19.886 22 18 22s-2.828 0-3.414-.586S14 19.886 14 18z" opacity=".5"/></g></svg>',
        play: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path fill-rule="evenodd" d="M23 12c0-1.035-.53-2.07-1.591-2.647L8.597 2.385C6.534 1.264 4 2.724 4 5.033V12z" clip-rule="evenodd"/><path d="m8.597 21.615l12.812-6.968A2.99 2.99 0 0 0 23 12H4v6.967c0 2.31 2.534 3.769 4.597 2.648" opacity=".5"/></g></svg>',
        del: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M3 6.524c0-.395.327-.714.73-.714h4.788c.006-.842.098-1.995.932-2.793A3.68 3.68 0 0 1 12 2a3.68 3.68 0 0 1 2.55 1.017c.834.798.926 1.951.932 2.793h4.788c.403 0 .73.32.73.714a.72.72 0 0 1-.73.714H3.73A.72.72 0 0 1 3 6.524"/><path d="M11.596 22h.808c2.783 0 4.174 0 5.08-.886c.904-.886.996-2.339 1.181-5.245l.267-4.188c.1-1.577.15-2.366-.303-2.865c-.454-.5-1.22-.5-2.753-.5H8.124c-1.533 0-2.3 0-2.753.5s-.404 1.288-.303 2.865l.267 4.188c.185 2.906.277 4.36 1.182 5.245c.905.886 2.296.886 5.079.886" opacity=".5"/><path fill-rule="evenodd" d="M9.425 11.482c.413-.044.78.273.821.707l.5 5.263c.041.433-.26.82-.671.864c-.412.043-.78-.273-.821-.707l-.5-5.263c-.041-.434.26-.821.671-.864m5.15 0c.412.043.713.43.671.864l-.5 5.263c-.04.434-.408.75-.82.707c-.413-.044-.713-.43-.672-.864l.5-5.264c.041-.433.409-.75.82-.707" clip-rule="evenodd"/></g></svg>',
        redo: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path fill-rule="evenodd" d="M6.873 7.873a7.25 7.25 0 0 1 7.928-1.563l1.13-1.13a8.75 8.75 0 1 0 4.751 6.727a.75.75 0 0 0-1.488.187a7.25 7.25 0 1 1-12.32-4.22" clip-rule="evenodd" opacity=".5"/><path d="M18.721 4.201a.75.75 0 0 0-1.28-.53l-1.51 1.51l-1.13 1.13l-1.603 1.603a.75.75 0 0 0 .53 1.28h4.243a.75.75 0 0 0 .75-.75z"/></g></svg>',
        info: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2s10 4.477 10 10" opacity=".5"/><path d="M12 17.75a.75.75 0 0 0 .75-.75v-6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75M12 7a1 1 0 1 1 0 2a1 1 0 0 1 0-2"/></g></svg>',
      }

      const RANK = { redo: 0, new: 1, wip: 2, paused: 3, done: 4 }

      /* Rework history of a row. The server's source of truth is the
         `reworks` array; records written before the history existed carry a
         single `rework` slot — read both, so an old fixlog-ratings.json needs
         no migration to render. */
      const rwOfKey = (key) => {
        const rec = state.ratings[key]
        if (!rec) return []
        return Array.isArray(rec.reworks) ? rec.reworks : rec.rework ? [rec.rework] : []
      }
      const rwOf = (r) => rwOfKey(r.key)
      /* Only the LAST iteration can be open — the server amends an open one
         instead of stacking a second. */
      const openRw = (r) => {
        const l = rwOf(r)
        const last = l[l.length - 1]
        return last && !last.done ? last : null
      }

      /* Effective status, computed — never stored. A finished fix that was
         sent back is not "done" any more, and that has to be true for sorting
         as well as for the dot, so both read it from here rather than from a
         field somebody has to remember to update. */
      const stOf = (r) => (openRw(r) ? 'redo' : r.status)

      /* Роут, за яким МОЖНА навігувати, витягнутий зі значення, яке майже
         ніколи не є чистим шляхом. Колонка «Роут» у fixlog.md — рукописна
         проза: агент пише туди і сам шлях, і елемент, по якому клацнули
         («`/search` (`Search` → `.sr-featured__tag`, «Sponsored»)»), а іноді
         взагалі не шлях («усі сторінки налаштувань», «глобально (іконки)»).
         Виграє перший /path-подібний токен; значення без шляху дає порожній
         рядок — такий рядок нікуди не веде і в дровері не відкривається.

         Одна функція на два виклики навмисно: панель групується САМЕ за тим
         екраном, який відкриє рядок усередині неї. Поки дровер брав сире
         `routePath`, а заголовок панелі — очищений, вони розходилися: клік по
         назві панелі показував потрібний макет, а клік по рядку віддавав
         iframe'у рядок на кшталт «/search (Search → …)», який SPA не знає, і
         `path="*"` малював лендинг. 173 з 255 рядків лога так і відкривалися. */
      const navRoute = (routePath) => {
        const m = String(routePath || '').match(/\/[\w\-./:%]*/)
        return m ? m[0].replace(/[.,;:)]+$/, '') : ''
      }
      /* Те саме значення в ролі ключа групи: заголовок панелі — це ім'я
         екрана, а «інше» збирає все, що екраном не є. */
      const groupKey = navRoute

      /* ХВ:СС — one shape for every duration in the column: the live clock
         of a running fix, the duration of a finished one, and the «3.9хв»
         text an agent typed into fixlog.md all render identically. Mixed
         shapes («45с», «2хв 10с», «1год 5хв») made the column unscannable —
         magnitudes have to line up as digits to be comparable at a glance.
         Хвилини НЕ загортаються на 60: прогін, що висить 83:20, має виглядати
         неправильно, а не вдавати годину з чимось. Секунди лишаються, бо
         дрібні правки живуть менше за хвилину, і 00:00 на всіх них не
         розрізняло б швидке від миттєвого. */
      const fmtMS = (sec) => {
        const s = Math.max(0, Math.floor(sec))
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
      }
      const fmtDur = (ms) => fmtMS(ms / 1000)

      /* Durations in fixlog.md are prose, written by hand by whichever agent
         closed the fix: «45с», «3.9хв», «2хв 10с», «1год 5хв», «<1хв». Parsed
         to seconds so the column can show them in the same ГГ:ХХ shape — and
         so sorting compares durations instead of strings, where «9хв» would
         land after «40с». Unparseable text returns null and is shown as it
         was written: better an odd cell than a confident 00:00 lie. */
      const durSecs = (text) => {
        const t = plain(text || '').toLowerCase().replace(',', '.')
        if (!t) return null
        /* «<1хв» — це «менше за», а не «одна»: спершу знак, потім числа. */
        if (t.startsWith('<')) return 0
        const grab = (unit) => {
          const m = t.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(?:${unit})`))
          return m ? parseFloat(m[1]) : 0
        }
        const h = grab('год|г|h'), m = grab('хв|м|m'), sec = grab('с|s')
        if (!h && !m && !sec) return null
        return h * 3600 + m * 60 + sec
      }

      /* Прочитане — у ГГ:ХХ, непрочитане — як написано, порожнє — риска. */
      const durCell = (text) => {
        if (!plain(text || '').trim()) return '<span class="muted">—</span>'
        const sec = durSecs(text)
        return sec === null ? esc(plain(text)) : fmtMS(sec)
      }

      /* Column widths live in CSS (.col--*), because the table is
         table-layout:fixed and one place for the numbers is what stops the
         header and the body from disagreeing. */
      /* `t` is what the header shows, `a` what it means to a screen reader.
         Статус shows NOTHING: the column is a lone dot per row, the tally
         above is its legend, and a worded header would be wider than every
         value under it. It still sorts on click like any other column. */
      const COLS = [
        { k: 'num',    t: 'ID' },
        { k: 'status', t: '', a: 'Статус' },
        { k: 'time',   t: 'Час' },
        { k: 'dur',    t: 'Трив.' },
        { k: 'req',    t: 'Запит' },
        { k: 'lane',   t: 'Агент' },
        { k: 'did',    t: 'Деталі' },
        { k: 'redo',   t: 'Доробки' },
      ]

      const STATUS_LABEL = { redo: 'На доробці', new: 'Нова', wip: 'В роботі', paused: 'На паузі', done: 'Зроблено' }
