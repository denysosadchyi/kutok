      /* THE column grid, in one place. Widths live in the .col--* CSS rules;
         this colgroup pins them to every table on the page — the shared
         header strip AND each panel under it. Panels have no thead, and
         table-layout:fixed reads its grid from the first ROW when no cols
         exist — which handed every panel its own improvised grid that could
         never line up with the header above it. */
      const COLGROUP = `<colgroup>${COLS.map((c) => `<col class="col--${c.k}">`).join('')}</colgroup>`
      document.querySelectorAll('#gheadWrap table').forEach((t) =>
        t.insertAdjacentHTML('afterbegin', COLGROUP))

      /* The resting-state mark, used by the status column AND the tally so
         the legend can never drift from the rows it explains. done → a
         checkbox; everything else keeps its dot. */
      const stMark = (k) =>
        k === 'done'
          ? '<svg class="ok-ic" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><g fill="currentColor"><path d="M12 22c-4.714 0-7.071 0-8.536-1.465C2 19.072 2 16.714 2 12s0-7.071 1.464-8.536C4.93 2 7.286 2 12 2s7.071 0 8.535 1.464C22 4.93 22 7.286 22 12s0 7.071-1.465 8.535C19.072 22 16.714 22 12 22" opacity=".5"/><path d="M16.03 8.97a.75.75 0 0 1 0 1.06l-5 5a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06l1.47 1.47l4.47-4.47a.75.75 0 0 1 1.06 0"/></g></svg>'
          : k === 'paused'
          ? '<svg class="ok-ic" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M2 6c0-1.886 0-2.828.586-3.414S4.114 2 6 2s2.828 0 3.414.586S10 4.114 10 6v12c0 1.886 0 2.828-.586 3.414S7.886 22 6 22s-2.828 0-3.414-.586S2 19.886 2 18z"/><path d="M14 6c0-1.886 0-2.828.586-3.414S16.114 2 18 2s2.828 0 3.414.586S22 4.114 22 6v12c0 1.886 0 2.828-.586 3.414S19.886 22 18 22s-2.828 0-3.414-.586S14 19.886 14 18z" opacity=".5"/></g></svg>'
          : `<i class="dot dot--${k}"></i>`

      /* The Доробки cell: send-back control plus the thread length. Open
         work has nothing to send back yet, so it shows a dash like every
         other not-applicable cell. */
      function rwCell(r) {
        const st = stOf(r)
        /* Only work NOBODY has started can be managed: a new annotation can
           be paused or deleted, a paused one resumed or deleted. Once an
           agent holds it (wip / redo) there is nothing safe to offer — you
           cannot un-run a running fix. Delete arms on the first click and
           fires on the second: cheaper than a modal, still not one twitch. */
        if (st === 'new' || st === 'paused') {
          const id = esc(r.key)
          return `<span class="rw acts">
              ${st === 'new'
                ? `<button type="button" class="icon-btn act" data-pause="${id}" aria-label="Призупинити" title="Призупинити — диспетчер її не візьме">${SVG.pause}</button>`
                : `<button type="button" class="icon-btn act" data-resume="${id}" aria-label="Відновити" title="Відновити — назад у чергу">${SVG.play}</button>`}
              <button type="button" class="icon-btn act act--del" data-del="${id}" aria-label="Видалити" title="Видалити (другий клік підтверджує)">${SVG.del}</button>
            </span>`
        }
        if (st === 'wip') return '<span class="muted">—</span>'
        const list = rwOf(r)
        const open = openRw(r)
        return `<span class="rw">
            <button type="button" class="icon-btn redo${open ? ' redo--on' : ''}" data-redo="${esc(r.key)}"
              aria-label="Відправити на доробку"
              title="${open ? 'На доробці: ' + esc(open.note) : 'Відправити на доробку'}">${SVG.redo}</button>
            ${list.length ? `<span class="rw-n">×${list.length}</span>` : ''}
          </span>`
      }

      /* The header lives twice — over the flat table and as the shared
         strip over the panels — built from one string so they can never
         drift, and skipped entirely when nothing changed: the auto-refresh
         must not rebuild focusable elements under the keyboard every 10s. */
      let headSig = ''
      function renderHead() {
        const html = COLS.map((c) => {
          const on = state.sort === c.k
          const arrow = on ? (state.dir > 0 ? '↑' : '↓') : ''
          return `<th data-sort="${c.k}" tabindex="0"
            class="col--${c.k}${on ? ' is-sorted' : ''}"
            aria-sort="${on ? (state.dir > 0 ? 'ascending' : 'descending') : 'none'}"
            aria-label="${c.a || c.t}" title="Сортувати">${c.t}<span class="ind">${arrow}</span></th>`
        }).join('')
        if (html === headSig) return
        headSig = html
        $('gthead').innerHTML = html
      }

      /* ── Incremental DOM ──────────────────────────────────────────────────
         The 10s refresh used to rebuild tbody.innerHTML wholesale — every
         cycle blinked, dropped hover, scroll anchoring and the armed state
         of buttons. Now the table is reconciled, not repainted:

           * every logical block (a fix with its thread, a group header, a
             gap, the empty state) is a UNIT with a stable key;
           * a unit's cells are compared against the TEMPLATE strings of the
             previous render — never against live DOM, which tick() mutates
             (elapsed counters would otherwise look "changed" every cycle
             and flicker back to empty);
           * only genuinely changed cells are swapped, only misplaced rows
             are moved (insertBefore of the EXISTING node — reorder, not
             recreation), only vanished units are removed.

         Sorting, grouping and theme still go through the same path: for
         them the reconciler degenerates into a pure reorder, which is
         exactly the cheapest correct thing. */
      const dom = new Map() // unit key → { trHtml: [..], cells: [[..]], nodes: [tr..] }

      const parseTr = (html) => {
        /* <template> parses table parts at top level — a bare div would
           silently drop the <tr>. */
        const tpl = document.createElement('template')
        tpl.innerHTML = html
        return tpl.content.firstElementChild
      }

      const syncAttrs = (oldEl, newEl) => {
        for (const a of [...oldEl.attributes])
          if (!newEl.hasAttribute(a.name)) oldEl.removeAttribute(a.name)
        for (const a of [...newEl.attributes])
          if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value)
      }

      /* Returns the unit's live nodes, updated in place where possible. */
      function syncUnit(key, trHtmlList) {
        const prev = dom.get(key)
        if (!prev) {
          const nodes = trHtmlList.map(parseTr)
          dom.set(key, {
            trHtml: trHtmlList.slice(),
            cells: nodes.map((tr) => [...tr.children].map((td) => td.outerHTML)),
            nodes,
          })
          return dom.get(key).nodes
        }
        const nodes = []
        const cells = []
        for (let i = 0; i < trHtmlList.length; i++) {
          if (prev.trHtml[i] === trHtmlList[i] && prev.nodes[i]) {
            /* Template unchanged — the live node stays exactly as it is,
               runtime state (focus, armed delete, ticking clock) included. */
            nodes.push(prev.nodes[i])
            cells.push(prev.cells[i])
            continue
          }
          const fresh = parseTr(trHtmlList[i])
          const freshCells = [...fresh.children].map((td) => td.outerHTML)
          const old = prev.nodes[i]
          if (!old || old.children.length !== fresh.children.length) {
            /* A thread grew, or the unit changed shape — here the whole tr
               is the update granule. */
            if (old) old.replaceWith(fresh)
            nodes.push(fresh)
            cells.push(freshCells)
            continue
          }
          /* Same shape: touch only the cells whose TEMPLATE changed. */
          syncAttrs(old, fresh)
          for (let j = 0; j < freshCells.length; j++) {
            if (prev.cells[i][j] !== freshCells[j]) {
              old.children[j].replaceWith(fresh.children[j].cloneNode(true))
            }
          }
          nodes.push(old)
          cells.push(freshCells)
        }
        /* A thread that shrank: drop the tail rows. */
        for (let i = trHtmlList.length; i < prev.nodes.length; i++) prev.nodes[i].remove()
        prev.trHtml = trHtmlList.slice()
        prev.cells = cells
        prev.nodes = nodes
        return nodes
      }

      /* Places every unit's nodes in order INSIDE the given tbody, moving
         only what is misplaced. In panel mode this runs once per panel, and
         a fix whose route changed groups simply gets its existing rows
         reparented by the same insertBefore. The removal sweep is global and
         happens once per render, in renderBody — a unit "missing" from one
         panel may just live in another. */
      let renderSeen = null
      function commit(units, tbody) {
        let anchor = null
        for (const u of units) {
          renderSeen.add(u.key)
          for (const n of syncUnit(u.key, u.trs)) {
            const ref = anchor ? anchor.nextSibling : tbody.firstChild
            if (n !== ref) tbody.insertBefore(n, ref)
            anchor = n
          }
        }
      }
      function sweepDom() {
        for (const [key, rec] of dom) {
          if (!renderSeen.has(key)) {
            rec.nodes.forEach((n) => n.remove())
            dom.delete(key)
          }
        }
      }

      /* Live panels in «За сторінками» mode: group key → its DOM. Panels are
         reconciled like rows — created once, retitled and reordered in
         place, removed when their route empties out. */
      const panels = new Map()

      function renderBody() {
        const k = state.sort
        const rows = state.rows.slice().sort((a, b) => {
          let av, bv
          /* Default order: newest first, across every status. Live annotations
             carry a real timestamp; done rows only have the log's HH:MM, so
             their order comes from position in the append-only log — later
             line means later fix. */
          if (k === 'fresh') return (b.fresh || 0) - (a.fresh || 0)
          if (k === 'status') { av = RANK[stOf(a)]; bv = RANK[stOf(b)] }
          else if (k === 'num') { av = a.num || 1e9; bv = b.num || 1e9 }
          /* Той самий парсер, що й малює комірку, — інакше стовпчик
             сортувався б не так, як читається. */
          else if (k === 'dur') { av = durSecs(a.dur) ?? -1; bv = durSecs(b.dur) ?? -1 }
          else if (k === 'time') { av = a.at || 0; bv = b.at || 0 }
          else if (k === 'redo') { av = rwOf(a).length; bv = rwOf(b).length }
          else { av = plain(a[k] || '').toLowerCase(); bv = plain(b[k] || '').toLowerCase() }
          if (av < bv) return -1 * state.dir
          if (av > bv) return 1 * state.dir
          /* Stable tiebreak so equal keys never reshuffle between renders. */
          return (b.ts || 0) - (a.ts || 0)
        })

        /* Status is a lone glyph with the word in title/aria-label: the
           colour vocabulary is tiny, the tally is the legend, and a repeated
           word per row was pure ink. The spinner is reserved for «В роботі» —
           the only state where something is running THIS second. */
        const stIcon = (st) =>
          `<span class="st st--${st}" role="img" title="${STATUS_LABEL[st]}" aria-label="${STATUS_LABEL[st]}">${
            st === 'wip'
              ? '<svg class="spin" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle opacity=".25" cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>'
              : stMark(st)
          }</span>`
        const rowHtml = (r, i) => {
              const st = stOf(r)
              const cls = st === 'wip' ? 'is-wip' : st === 'redo' ? 'is-redo' : st === 'paused' ? 'is-paused' : ''
              /* data-i is the row's index in `visible`, carried on the tr
                 because thread rows sit between parents and positional
                 indexOf would drift. Thread rows borrow the parent's index:
                 clicking anywhere in the thread opens the parent's screen. */
              const parent = `<tr class="${cls}" data-route="${esc(navRoute(r.routePath))}" data-i="${i}" tabindex="0"
              data-x="${r.x ?? ''}" data-y="${r.y ?? ''}" data-num="${r.num ?? ''}">
              <td class="idx">${r.num || ''}</td>
              <td>${stIcon(st)}</td>
              <td class="tab">${
                r.at
                  ? `<span class="ago" data-at="${r.at}" title="${esc(plain(r.time))}"></span>`
                  : esc(plain(r.time))
              }</td>
              <td class="tab tab--r">${
                st === 'wip'
                  /* Годинник роботи біжить від моменту, коли її ВЗЯЛИ, а не
                     коли анотацію намалювали. Тулбар перезаливає свої локальні
                     копії зі СТАРИМ timestamp — рахунок від нього показував
                     «04:12» на правці, яку щойно почали. */
                  ? `<span class="elapsed" data-since="${r.startedAt || r.ts || 0}"></span>`
                  : durCell(r.dur)
              }</td>
              <td><div class="req" title="${esc(plain(r.req || ''))}">${inline(r.req || '—')}</div></td>
              <td>${lane(r.laneRaw)}</td>
              <td>${
                r.did || st === 'redo'
                  ? `<button type="button" class="icon-btn info${
                      st === 'redo' ? ' info--redo' : ''
                    }" data-info="${esc(r.key)}" aria-label="Деталі" title="Деталі">${SVG.info}</button>`
                  : '<span class="muted">—</span>'
              }</td>
              <td>${rwCell(r)}</td>
            </tr>`
              /* The rework thread: one child row per iteration, branch glyph
                 in the # column, the reviewer's note in the request column —
                 the note IS the request of its iteration. An open iteration
                 shows a live clock; a closed one, how long the round took. */
              const thread = rwOf(r).map((rw, j, l) => {
                const openIt = !rw.done
                const at = Date.parse(rw.at) || 0
                const label = openIt ? 'На доробці' : 'Виправлено'
                return `<tr class="sub${openIt ? ' is-redo' : ''}" data-route="${esc(navRoute(r.routePath))}" data-i="${i}">
                <td class="tab"><span class="sub__b">${
                  j === l.length - 1 ? '└' : '├'
                }</span> <span class="sub__id">${
                  /* Suffix id: iteration 2 of fix 74 is «74.2» — the handle a
                     human quotes back about a round, exactly like num for the
                     fix itself. Before load() has numbered the rows the base
                     is briefly a bare dot («.2»); the next render fills it. */
                  (r.num ? r.num + '.' : '.') + (j + 1)
                }</span></td>
                <td><span class="st ${openIt ? 'st--redo' : 'st--fixed'}" role="img" title="${label}" aria-label="${label}"><i class="dot ${openIt ? 'dot--redo' : 'dot--fixed'}"></i></span></td>
                <td class="tab">${at ? hhmm(at) : ''}</td>
                <td class="tab tab--r">${
                  openIt
                    ? `<span class="elapsed" data-since="${at}"></span>`
                    : (rw.doneAt ? fmtDur((Date.parse(rw.doneAt) || at) - at) : '<span class="muted">—</span>')
                }</td>
                <td><div class="req" title="${esc(plain(rw.note || ''))}">${inline(rw.note || '—')}</div></td>
                <td><span class="muted">—</span></td>
                <td><span class="muted">—</span></td>
                <td><span class="muted">—</span></td>
              </tr>`
              })
              return [parent, ...thread]
        }

        /* A row unit is the parent tr plus its thread trs — the thread
           belongs to the fix, so it moves and dies with it. */
        visible = []
        renderSeen = new Set()
        const rowUnit = (r) => {
          const i = visible.push(r) - 1
          return { key: 'row:' + r.key, trs: rowHtml(r, i) }
        }
        /* Both modes render the SAME panel; they differ only in how the rows
           are cut into panels. Ungrouped is the degenerate cut — one panel
           holding everything — and an empty log is that same panel with the
           empty state inside, whatever the toggle says. Keeping one code path
           is the point: two paths were what let the two views drift apart. */
        const usePanels = grouped && rows.length > 0
        if (!rows.length) {
          syncPanels([[ALL_KEY, [{ key: 'empty', trs: [`<tr><td colspan="${COLS.length}" class="empty">
                <b>Поки що порожньо</b>
                <span>Правки з тулбара Agentation і рядки з fixlog.md з'являться тут.</span>
              </td></tr>`] }], 'Усі правки']])
        } else if (!usePanels) {
          /* Звичайний перегляд теж згрупований — за давністю. Плаский список
             із двохсот рядків не має жодного орієнтира: «сьогоднішнє» від
             «тижневого» відділяє лише зміна цифр у стовпчику часу. Смуги
             дають той самий орієнтир, що й роути в іншому режимі, і по тій
             самій осі, за якою список і так відсортований за замовчуванням.

             Ряд свідомо грубий і нерівномірний: свіже цікавить із точністю до
             півгодини, вчорашнє — з точністю до дня. Рядки лога без читабельного
             часу («10:2x» у ранніх записах) осідають у хвіст окремою смугою,
             а не вдають, ніби вони з 1970 року. */
          const buckets = new Map()
          for (const r of rows) {
            const k = ageBucket(r.at || 0)
            if (!buckets.has(k)) buckets.set(k, [])
            buckets.get(k).push(r)
          }
          const ordered = [...buckets.entries()].sort((a, b) => a[0] - b[0])
          syncPanels(ordered.map(([k, members]) =>
            [AGE_KEY + k, members.map(rowUnit), AGE_LABEL[k]]))
        } else {
          /* Group by normalised route. Rows arrive already sorted by the
             active sort, and grouping only PARTITIONS that order — inside a
             group the sort stays whatever the header says. Groups themselves
             are ordered by their freshest member: the screen someone touched
             last is the screen the reviewer came to check. */
          const groups = new Map()
          for (const r of rows) {
            const k = groupKey(r.routePath) || OTHER_KEY
            if (!groups.has(k)) groups.set(k, [])
            groups.get(k).push(r)
          }
          const freshest = (members) => Math.max(...members.map((r) => r.fresh || 0))
          const ordered = [...groups.entries()]
            .sort((a, b) => freshest(b[1]) - freshest(a[1]))
          syncPanels(ordered.map(([k, members]) => [k, members.map(rowUnit)]))
        }

        sweepDom()
      }

      /* The route in a panel header is a LINK into the same iframe preview
         the rows use — the panel names a screen, so clicking the name shows
         the screen. «інше» has no screen to show, and the single ungrouped
         panel names no screen at all; both stay plain spans. */
      const PAGE_IC = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><g fill="currentColor"><path fill-rule="evenodd" d="M14 22h-4c-3.771 0-5.657 0-6.828-1.172S2 17.771 2 14v-4c0-3.771 0-5.657 1.172-6.828S6.239 2 10.03 2c.606 0 1.091 0 1.5.017q-.02.12-.02.244l-.01 2.834c0 1.097 0 2.067.105 2.848c.114.847.375 1.694 1.067 2.386c.69.69 1.538.952 2.385 1.066c.781.105 1.751.105 2.848.105h4.052c.043.534.043 1.19.043 2.063V14c0 3.771 0 5.657-1.172 6.828S17.771 22 14 22" clip-rule="evenodd" opacity=".5"/><path d="m11.51 2.26l-.01 2.835c0 1.097 0 2.066.105 2.848c.114.847.375 1.694 1.067 2.385c.69.691 1.538.953 2.385 1.067c.781.105 1.751.105 2.848.105h4.052q.02.232.028.5H22c0-.268 0-.402-.01-.56a5.3 5.3 0 0 0-.958-2.641c-.094-.128-.158-.204-.285-.357C19.954 7.494 18.91 6.312 18 5.5c-.81-.724-1.921-1.515-2.89-2.161c-.832-.556-1.248-.834-1.819-1.04a6 6 0 0 0-.506-.154c-.384-.095-.758-.128-1.285-.14z"/></g></svg>'
      /* Keys namespaced with \u0000 so no real route can ever collide
         with them — a route starting with a NUL byte does not exist. */
      const ALL_KEY = '\u0000all'
      const AGE_KEY = '\u0000age:'

      /* Сходинки давності. Індекс — і ключ панелі, і порядок згори вниз. */
      const AGE_LABEL = [
        'Щойно',           // < 15 хв
        'Пів години',      // < 45 хв
        'Година',          // < 90 хв
        'Кілька годин',    // < 6 год
        'Сьогодні раніше', // < 24 год
        'Учора',
        'Цього тижня',
        'Давніше',
        'Без часу',        // рядки лога, з яких час не читається
      ]
      const ageBucket = (at) => {
        if (!at) return 8
        const m = (Date.now() - at) / 60000
        if (m < 15) return 0
        if (m < 45) return 1
        if (m < 90) return 2
        if (m < 360) return 3
        if (m < 1440) return 4
        if (m < 2880) return 5
        if (m < 10080) return 6
        return 7
      }
      const OTHER_KEY = '\u0000other'

      function panelHead(key, n, label) {
        const name = label
          ? `<span class="grp__route grp__route--plain">${esc(label)}</span>`
          : key === OTHER_KEY
            ? '<span class="grp__route grp__route--plain">інше</span>'
            : `<button type="button" class="grp__route" data-open-route="${esc(key)}"
                title="Відкрити ${esc(key)} у прев'ю">${PAGE_IC}${esc(key)}</button>`
        /* The empty state is a panel with nothing in it — a «×0» beside the
           words «поки що порожньо» would be counting the void. */
        return name + (n ? `<span class="grp__n">×${n}</span>` : '')
      }

      /* One PANEL per entry: own shell, title bar, tbody. Reconciled like
         everything else — created once, retitled only when the count or name
         changes, reordered with insertBefore, its rows committed into its own
         tbody. Panels without an entry this render are removed, and that is
         what makes the mode toggle free: «Усі правки» and the per-route
         panels are the same function fed a different set of keys. */
      function syncPanels(entries) {
        const gWrap = $('groups')
        const seenPanels = new Set()
        let anchor = null
        for (const [k, units, label] of entries) {
          seenPanels.add(k)
          let pnl = panels.get(k)
          if (!pnl) {
            const el = document.createElement('section')
            el.className = 'pnl'
            el.innerHTML = `<header class="pnl__head"></header><table>${COLGROUP}<tbody></tbody></table>`
            pnl = { el, head: el.firstElementChild, tbody: el.querySelector('tbody'), headHtml: '' }
            panels.set(k, pnl)
          }
          const rowCount = units.length && units[0].key !== 'empty' ? units.length : 0
          const headHtml = panelHead(k, rowCount, label)
          if (pnl.headHtml !== headHtml) {
            pnl.head.innerHTML = headHtml
            pnl.headHtml = headHtml
          }
          const ref = anchor ? anchor.nextSibling : gWrap.firstChild
          if (pnl.el !== ref) gWrap.insertBefore(pnl.el, ref)
          anchor = pnl.el
          commit(units, pnl.tbody)
        }
        for (const [k, pnl] of panels) {
          if (!seenPanels.has(k)) { pnl.el.remove(); panels.delete(k) }
        }
      }

      const render = () => { renderHead(); renderBody(); tick() }

      /* Live elapsed time for anything still running. Driven by its own 1s
         ticker rather than by the 10s data refresh — a counter that only moves
         when the table reloads looks frozen. Reads the annotation's own
         timestamp, so it survives a re-render without restarting. */
      function tick() {
        const now = Date.now()
        document.querySelectorAll('.elapsed').forEach((el) => {
          const since = Number(el.dataset.since) || 0
          if (!since) { el.textContent = '—'; return }
          el.textContent = fmtDur(now - since)
        })
        document.querySelectorAll('.ago').forEach((el) => {
          el.textContent = ago(Number(el.dataset.at) || 0)
        })
      }
      setInterval(tick, 1000)

      /* Header click sorts; clicking the active column flips direction. */
      function sortBy(k) {
        state.dir = state.sort === k ? -state.dir : 1
        state.sort = k
        render()
      }
      document.addEventListener('click', (e) => {
        const th = e.target.closest('th[data-sort]')
        if (!th) return
        sortBy(th.dataset.sort)
      })
      /* Headers and rows are focusable, so both answer the keyboard too. */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        if (!e.target.closest) return
        const th = e.target.closest('th[data-sort]')
        if (th) { e.preventDefault(); sortBy(th.dataset.sort); return }
        const tr = e.target.closest('tr[data-i]')
        if (tr && e.target === tr) { e.preventDefault(); openAt(Number(tr.dataset.i)) }
      })

      /* ── Drawer ───────────────────────────────────────────────────────── */
      const dr = $('dr')

      function openAt(i) {
        if (i < 0 || i >= visible.length) return
        /* Рядок без справжнього роуту («усі сторінки налаштувань») показувати
           нема чого. Виходимо ДО зсуву курсора: інакше ‹ › і лічильник «12/255»
           переїхали б на рядок, якого в дровері так і не видно. */
        const route = navRoute(visible[i].routePath)
        if (!route) return
        cursor = i
        /* Mark the row (and its thread — they share data-i) being previewed,
           so ‹ › in the drawer visibly walks the table behind it. Renders
           pause while the drawer is open, so the class survives. */
        document.querySelectorAll('tr.is-current').forEach((el) => el.classList.remove('is-current'))
        document.querySelectorAll(`tr[data-i="${i}"]`).forEach((el) => el.classList.add('is-current'))
        const r = visible[i]
        openDrawer(
          route,
          r.x != null && r.y != null ? { x: r.x, y: r.y, num: r.num } : null,
          r.status === 'done' ? r.key : '',
          r,
        )
      }
      function openDrawer(route, pin, key, row) {
        if (!route || route === '—') return
        /* The name is the request itself — what was asked for is what
           identifies a fix to a human; the route is supporting detail. */
        $('drName').textContent = row ? plain(row.req || '—') : route
        $('drPos').textContent = cursor >= 0 ? `${cursor + 1}/${visible.length}` : ''
        $('drPrev').disabled = cursor <= 0
        $('drNext').disabled = cursor < 0 || cursor >= visible.length - 1
        /* Rating lives in the drawer too: the honest moment to judge a fix is
           while looking at the screen it changed, not while scanning a table.
           Only done rows have a verdict to give — open ones have nothing to
           rate yet. */
        const rate = $('drRate')
        if (key) {
          rate.hidden = false
          rate.dataset.key = key
          const open = row ? openRw(row) : null
          $('drRedo').dataset.redo = key
          $('drRedo').classList.toggle('redo--on', !!open)
        } else {
          rate.hidden = true
        }
        $('drOpen').href = route
        const f = $('drFrame')
        f.onload = () => pin && dropPin(f, pin)
        f.src = route
        dr.hidden = false
        document.body.style.overflow = 'hidden'
      }

      /* The drawer and the app are the same origin, so the pin goes INTO the
         iframe's document rather than floating over it — that way it scrolls
         with the content and stays on the element it marks.

         Retried, not fired once: `load` fires when the HTML document itself is
         parsed, but the wireframe inside still has images and fonts to load,
         and layout keeps shifting for a beat after that. At that moment the
         body can still be shorter than its final height, so a pin placed at
         y=900 lands past the end of the document and the scroll goes nowhere.
         The retry re-places it as the page grows and stops once the body is
         tall enough to actually hold it. */
      function closeDrawer() {
        dr.hidden = true
        document.querySelectorAll('tr.is-current').forEach((el) => el.classList.remove('is-current'))
        /* Blank the frame: otherwise the app keeps running behind the scrim,
           with its own timers, fetches and annotation toolbar alive. */
        $('drFrame').src = 'about:blank'
        document.body.style.overflow = ''
      }

      function dropPin(frame, pin) {
        const y = Number(pin.y) || 0
        let tries = 0

        const place = () => {
          let d
          try { d = frame.contentDocument } catch { return } // navigated cross-origin
          if (!d || !d.body) { if (++tries < 40) setTimeout(place, 100); return }

          let el = d.getElementById('fixlog-pin')
          if (!el) {
            el = d.createElement('div')
            el.id = 'fixlog-pin'
            el.textContent = pin.num || '1'
            /* Literal colours on purpose: this node is injected into ANOTHER
               document (the app's), which has never seen this page's tokens
               and must not be made to depend on them. */
            el.style.cssText = [
              'position:absolute', 'transform:translate(-50%,-50%)',
              'z-index:2147483647', 'width:28px', 'height:28px',
              'border-radius:50%', 'display:flex', 'align-items:center',
              'justify-content:center', 'background:#f5a524', 'color:#1a2333',
              'font:700 13px/1 system-ui,sans-serif',
              'box-shadow:0 0 0 3px rgba(245,165,36,.45), 0 2px 10px rgba(0,0,0,.35)',
              'pointer-events:none',
            ].join(';')
            d.body.appendChild(el)
          }
          el.style.left = `${pin.x}%`
          el.style.top = `${y}px`

          /* Keep going until the document is genuinely tall enough for the
             pin's position to mean anything — otherwise we would scroll to a
             page that has not been laid out yet. */
          const tall = d.documentElement.scrollHeight > y + 40
          if (tall) {
            frame.contentWindow.scrollTo({ top: Math.max(0, y - 220) })
          }
          if (++tries < 40 && !tall) setTimeout(place, 100)
        }

        place()
      }

      /* Group-header route → drawer with no row context: cursor parks at -1
         so ‹ › disable themselves and the position readout stays blank. */
      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-open-route]')
        if (!b) return
        cursor = -1
        openDrawer(b.dataset.openRoute, null, '', null)
      })

      $('drScrim').addEventListener('click', closeDrawer)
      $('drClose').addEventListener('click', closeDrawer)
      $('drPrev').addEventListener('click', () => openAt(cursor - 1))
      $('drNext').addEventListener('click', () => openAt(cursor + 1))
      document.addEventListener('keydown', (e) => {
        if (dr.hidden) return
        /* The dialog sits on top of the drawer: while it is open the keyboard
           belongs to it, or typing a note would walk the drawer and one Escape
           would close both at once. */
        if (!pop.hidden) return
        if (e.key === 'Escape') closeDrawer()
        if (e.key === 'ArrowLeft') openAt(cursor - 1)
        if (e.key === 'ArrowRight') openAt(cursor + 1)
      })
      /* Row opens the screen — but not when the click was aimed at a control
         that lives inside the same row: any button (Деталі, send-back), the
         selection checkbox, or a header. */
      document.addEventListener('click', (e) => {
        if (e.target.closest('button, a, input, th')) return
        const tr = e.target.closest('tr[data-route]')
        if (!tr) return
        const i = Number(tr.dataset.i)
        if (Number.isInteger(i)) openAt(i)
      })

      /* ── Pre-work actions ─────────────────────────────────────────────────
         Pause = PATCH the annotation to a status the dispatcher's feed never
         serves (`GET /pending` filters on 'pending' in SQL, and the server
         stores any status string verbatim — verified against the agentation
         source). Resume = PATCH back to pending. Delete = the same DELETE
         the resolve-workflow already uses, armed by a first click instead of
         a modal: the second click within three seconds is the confirmation,
         doing nothing disarms. */
      document.addEventListener('click', async (e) => {
        const del = e.target.closest('[data-del]')
        const pause = e.target.closest('[data-pause]')
        const resume = e.target.closest('[data-resume]')
        if (!del && !pause && !resume) return
        try {
          if (del) {
            if (!del.classList.contains('is-armed')) {
              del.classList.add('is-armed')
              del.title = 'Ще раз — і видалено'
              setTimeout(() => {
                del.classList.remove('is-armed')
                del.title = 'Видалити (другий клік підтверджує)'
              }, 3000)
              return
            }
            const r = await fetch(`${ANN}/annotations/${encodeURIComponent(del.dataset.del)}`, { method: 'DELETE' })
            if (!r.ok) throw new Error('HTTP ' + r.status)
          } else {
            const id = pause ? pause.dataset.pause : resume.dataset.resume
            const r = await fetch(`${ANN}/annotations/${encodeURIComponent(id)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: pause ? 'paused' : 'pending' }),
            })
            if (!r.ok) throw new Error('HTTP ' + r.status)
          }
          load()
        } catch (err) {
          /* #note, not #warn: load() repaints #warn every cycle. */
          $('note').innerHTML = `<div class="err">Дія не вдалась: ${esc(err.message)}</div>`
        }
      })

      /* ── Group-by-route toggle ────────────────────────────────────────────
         A view mode, not a filter: the same rows, partitioned per screen.
         Remembered like the theme — a reviewer who thinks in screens always
         thinks in screens. */
      let grouped = localStorage.getItem('fixlog-group') === '1'
      const setMode = (on) => {
        grouped = on
        localStorage.setItem('fixlog-group', on ? '1' : '0')
        $('segAll').setAttribute('aria-pressed', String(!on))
        $('segPages').setAttribute('aria-pressed', String(on))
        render()
      }
      /* Не тумблер: натиск на вже вибраний сегмент нічого не робить, бо
         сегмент — це стан, а не дія. */
      $('segAll').addEventListener('click', () => grouped && setMode(false))
      $('segPages').addEventListener('click', () => grouped || setMode(true))
      setMode(grouped)

      /* ── Theme ────────────────────────────────────────────────────────────
         The boot script in <head> chose the initial theme; this only has to
         flip and remember. Remembering makes the OS preference a default,
         never an override of an explicit choice. */
      $('theme').addEventListener('click', () => {
        const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        localStorage.setItem('fixlog-theme', t)
      })

      /* ── Details / rework dialog ──────────────────────────────────────── */
      const pop = $('pop')
      let popKey = ''

      /* Two modes, one dialog: reading what a fix did, and telling it to be
         redone. They share the same subject line, so splitting them into two
         components would duplicate more than it separates. */
      function openPop(key, label, mode) {
        popKey = key
        const details = mode === 'info'
        $('popTitle').textContent = details ? 'Що зроблено' : 'На доробку'
        const rowN = state.rows.find((r) => r.key === key)
        $('popSub').innerHTML =
          `${rowN && rowN.num ? `<span class="id">${rowN.num}</span> ` : ''}${esc(label || '')}`

        const row = state.rows.find((r) => r.key === key)
        const open = row ? openRw(row) : null

        const body = $('popBody')
        body.hidden = !details
        if (details) {
          /* Chronological: what the fix did first, then the thread — each
             iteration is note (why it was rejected) plus, once closed, what
             the redo changed. This dialog is the whole corpus entry in one
             view: запит → зроблено → чому не влаштувало → що виправлено. */
          const thread = (row ? rwOf(row) : []).map((rw, j) =>
            `<div class="pop__it${rw.done ? '' : ' pop__it--open'}">
              <div class="pop__it-head">доробка ${j + 1} · ${
                rw.done ? 'виправлено' : 'відкрита'
              }${rw.at ? ' · ' + hhmm(Date.parse(rw.at)) : ''}</div>
              <div>${inline(rw.note || '')}</div>
              ${rw.result ? `<div class="pop__it-res">${inline(rw.result)}</div>` : ''}
            </div>`).join('')
          body.innerHTML =
            (row && row.did ? inline(row.did) : '<span class="muted">Немає опису.</span>') +
            thread
        }
        /* The form only exists in rework mode. Re-opening while an iteration
           is still open pre-fills its note: sending again AMENDS the open
           instruction (the server keeps one open iteration per fix). */
        $('popNote').hidden = details
        $('popSend').hidden = details
        $('popCancel').textContent = details ? 'Закрити' : 'Скасувати'
        $('popNote').value = open ? open.note : ''
        $('popErr').textContent = ''
        pop.hidden = false
        if (!details) $('popNote').focus()
      }
      const closePop = () => { pop.hidden = true; popKey = '' }

      $('popScrim').addEventListener('click', closePop)
      $('popCancel').addEventListener('click', closePop)
      document.addEventListener('keydown', (e) => {
        if (!pop.hidden && e.key === 'Escape') closePop()
      })

      document.addEventListener('click', (e) => {
        const info = e.target.closest('[data-info]')
        if (info) {
          e.stopPropagation()
          const key = info.dataset.info
          const row = state.rows.find((r) => r.key === key)
          openPop(key, row ? plain(row.req) : '', 'info')
          return
        }
        const b = e.target.closest('[data-redo]')
        if (!b) return
        e.stopPropagation() // must not also open the drawer behind it
        const key = b.dataset.redo
        const row = state.rows.find((r) => r.key === key)
        openPop(key, row ? plain(row.req) : '', 'redo')
      })

      $('popSend').addEventListener('click', async () => {
        const note = $('popNote').value.trim()
        if (!note) { $('popErr').textContent = 'Напиши, що не так'; return }
        const btn = $('popSend')
        btn.disabled = true
        try {
          const r = await fetch(`${RATE}/rework`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: popKey, note }),
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok || !data.ok) throw new Error(data.error || 'HTTP ' + r.status)
          state.ratings[popKey] = data.rating
          closePop()
          render()
        } catch (err) {
          $('popErr').textContent = 'Не відправилось: ' + err.message
        } finally {
          btn.disabled = false
        }
      })

      /* ── Живий фавікон ─────────────────────────────────────────────────
         Цю сторінку тримають у фоновій вкладці й позирають на неї, поки
         конвеєр доробляє. Заголовок уже несе лічильники, але у згорнутій
         вкладці з нього видно щонайбільше пару літер — а іконку видно
         завжди. Тож стан «зараз щось у роботі» живе саме в ній.

         Не GIF: Chrome анімовані GIF-фавікони не програє взагалі (Firefox
         програє). Єдиний спосіб, що працює скрізь, — перемальовувати
         <canvas> і щоразу підставляти свіжий data-URL у той самий
         <link rel=icon>.

         Крок дискретний — 12 поділок, а не плавний оберт — і це рішення, не
         економія: у фоновій вкладці браузер тротлить таймери приблизно до
         секунди, тож плавна анімація там усе одно розсипалась би на ривки.
         Дванадцять поділок з таким кроком читаються як стрілка годинника:
         повільно — але навмисно повільно, а не залипло.

         Коли роботи немає, повертається штатний favicon.png. Іконка-крутілка
         це стан, а не нова айдентика сторінки. */
      const favicon = (() => {
        const link = document.querySelector('link[rel="icon"]')
        const IDLE = link.getAttribute('href')
        const N = 32          // 2× за 16px слот вкладки — щоб не мулило
        const R = 13          // зовнішній радіус поділки
        const TICKS = 12
        const cv = document.createElement('canvas')
        cv.width = cv.height = N
        const cx = cv.getContext('2d')

        /* Канва не розуміє var(), тож колір беремо з того самого токена, що
           й уся сторінка, — інакше при перемиканні теми іконка лишалась би
           від попередньої. Якщо браузер не парсить oklch у канві, він мовчки
           ігнорує присвоєння і малює чорним, тому перевіряємо один раз. */
        const probe = document.createElement('canvas').getContext('2d')
        probe.strokeStyle = '#000000'
        probe.strokeStyle = 'oklch(0.72 0.13 245)'
        const OKLCH = probe.strokeStyle !== '#000000'
        const colour = () => {
          if (!OKLCH) return '#4aa3ff'
          const v = getComputedStyle(document.documentElement)
            .getPropertyValue('--info').trim()
          return v || '#4aa3ff'
        }

        let phase = 0
        let timer = null
        let on = false

        const frame = () => {
          cx.clearRect(0, 0, N, N)
          cx.strokeStyle = colour()
          cx.lineCap = 'round'
          cx.lineWidth = 3.4
          for (let i = 0; i < TICKS; i++) {
            /* Голова найяскравіша, хвіст згасає. Рух несе прозорість, а не
               колір, — тому це читається як один об'єкт, що обертається, а
               не як дванадцять крапок, що блимають. */
            const age = (i - phase + TICKS * 2) % TICKS
            cx.globalAlpha = 0.12 + 0.88 * (1 - age / TICKS)
            const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2
            cx.beginPath()
            cx.moveTo(N / 2 + Math.cos(a) * (R - 5), N / 2 + Math.sin(a) * (R - 5))
            cx.lineTo(N / 2 + Math.cos(a) * R, N / 2 + Math.sin(a) * R)
            cx.stroke()
          }
          cx.globalAlpha = 1
          link.href = cv.toDataURL('image/png')
          phase = (phase + 1) % TICKS
        }

        /* Перемикається лише на зміні стану: інакше кожен цикл опитування
           гнав би зайвий toDataURL і смикав <link> без причини. */
        const set = (running) => {
          if (running === on) return
          on = running
          if (running) {
            frame()
            timer = setInterval(frame, 90)
          } else {
            clearInterval(timer)
            timer = null
            link.href = IDLE
          }
        }
        set.isRunning = () => on
        return set
      })()

      /* ── Boot ─────────────────────────────────────────────────────────── */

      async function load() {
        /* The log renders FIRST, from a static file on the same origin. The
           annotation server and the ratings service are both optional, remote,
           and can be slow or firewalled — awaiting them before the first paint
           is what turned this page blank. Draw what is certain, then enrich. */
        /* './fixlog.md', not '/fixlog.md': ця сторінка лежить у dev/, поруч
           із журналом, а не в корені сайту — абсолютний шлях від кореня тут
           же й провалиться. Відносний шлях працює однаково, відкрий сторінку
           хоч як http://<хост>:8901/dev/fixlog.html. */
        const mdRes = await fetch('./fixlog.md?t=' + Date.now())
          .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text() })
          .then((v) => ({ v }), (e) => ({ e: e.message }))

        /* Composed OFF-SCREEN. state.rows is not touched until the whole new
           snapshot is ready: publishing the half-built list (done rows only,
           annotations still in flight) made every cycle collapse the table's
           height and grow it back — the visible "jump". The one exception is
           the very first boot, where partial data beats a blank page. */
        const done = []
        if (!mdRes.e) {
          parseDone(mdRes.v).forEach((r, i) =>
            done.push({ ...r, status: 'done', routePath: r.routeRes || plain(r.route), ts: 0, fresh: i + 1 }))
        }
        if (!state.rows.length && done.length) {
          state.rows = done.slice()
          render()
        }

        state.ratingsErr = ''
        getJSON(`${RATE}/ratings`)
          .then((v) => {
            /* Re-render only when the verdicts actually changed — this fires
               every cycle, and an idle page must not repaint on a no-op. */
            const changed = JSON.stringify(v) !== JSON.stringify(state.ratings)
            state.ratings = v
            if (changed) render()
          })
          /* Keep the last good snapshot on a transient failure: blanking the
             threads for one dropped request is worse than being 10s stale. */
          .catch((e) => { state.ratingsErr = e.message })

        const open = await loadOpen().then((v) => ({ v }), (e) => ({ e: e.message }))
        const md = mdRes
        const rows = done.slice()
        /* x is a percentage of the document width, y an absolute pixel
           offset — that is how the toolbar stores a pin. Carried through so
           the drawer can drop the same pin back onto the screen. */
        /* Коли правка з'явилася — це `createdAt` СЕРВЕРА, а не `timestamp`
           тулбара, і різниця тут не академічна.

           `timestamp` ставить браузерний тулбар у мить, коли користувач тицьнув
           пін, і тримає його в localStorage. Тулбар періодично перезаливає свої
           локальні копії — під НОВИМ id, але зі СТАРИМ `timestamp`. Тобто
           запис, який щойно потрапив у чергу, приносить із собою час, коли його
           набрали в браузері годинами раніше. На сервері це видно впритул:
           вісім анотацій із `createdAt` 16:18:40.95x (один bulk-POST, id
           відрізняються мілісекундами) несуть `timestamp` від 11:09 до 15:18 —
           розкид у п'ять годин там, де насправді один момент. Колонка «Час»
           показувала 11:09, а «щойно» перетворювалося на «5год» для рядка, що
           з'явився секунду тому.

           `createdAt` такої проблеми не має: сервер штампує його сам, і він
           збігається з часом, зашитим у сам id (id = base36 від Date.now()
           клієнта в мить запису — звіряється до мілісекунди). Той самий корінь
           уже ламав лічильник роботи; його полагодили через `updatedAt`, а поле
           `at` лишилося сидіти на битому джерелі — оце й лагодиться тут.

           `timestamp` лишається запасним варіантом: на давніх записах, зроблених
           до появи `createdAt`, він єдиний час, який взагалі є. */
        const mk = (a, st) => {
          const created = Date.parse(a.createdAt || '') || a.timestamp || 0
          return {
            key: a.id, status: st, time: hhmm(created), routePath: routeOf(a.url),
            req: a.comment || '', laneRaw: '', did: '', ts: created,
            /* `at` — коли анотація потрапила в чергу (для «3хв тому» і смуг
               давності). `startedAt` — коли її ВЗЯЛИ в роботу: сервер проставляє
               updatedAt на переході в acknowledged, і саме звідти має бігти
               лічильник роботи. */
            at: created,
            startedAt: Date.parse(a.updatedAt || '') || 0,
            x: a.x, y: a.y,
            /* Live annotations always outrank logged ones: they are, by
               definition, the work that has not happened yet. */
            fresh: 1e12 + created,
          }
        }
        /* Ghost filter — тепер СТРАХОВКА, а не механізм.

           Дублі народжувалися з того, що виконавець видаляв закриту анотацію,
           а тулбар перезаливав із localStorage усе, чийого id сервер не знає.
           Обидва кінці полагоджено там, де вони живуть: виконавцям заборонено
           DELETE (анотація лишається `resolved`, і тулбару нема що доливати),
           а диспетчер відсіює на вході за підписом «роут + елемент + текст»,
           не за id. Фільтр лишається для копій, що вже лежать по браузерах із
           тих часів: сервер про них не знає, поки вкладку не оновлять.

           Збіг шукаємо так, як шукала б людина: same
           screen, same words. */
        const norm = (t) => plain(t || '').toLowerCase().replace(/\s+/g, ' ').trim()
        const doneSigs = new Set(
          done.map((r) => `${plain(r.route)}::${norm(r.req)}`),
        )
        const isGhost = (a) =>
          doneSigs.has(`${routeOf(a.url)}::${norm(a.comment)}`)

        let ghosts = 0
        if (!open.e) {
          for (const a of open.v.pending) {
            if (isGhost(a)) { ghosts++; continue }
            rows.push(mk(a, 'new'))
          }
          for (const a of open.v.wip) {
            if (isGhost(a)) { ghosts++; continue }
            rows.push(mk(a, 'wip'))
          }
          for (const a of open.v.paused || []) {
            if (isGhost(a)) { ghosts++; continue }
            rows.push(mk(a, 'paused'))
          }
        }
        /* Every fix gets a number, closed ones included — it is the short
           handle a human quotes back ("правка 14"), and the composite key in
           the ID column is too long to say out loud.

           Ordered oldest-first across the whole set, so a number, once given,
           never changes: the log only ever grows at the end, and live
           annotations sort after everything already logged. The same number is
           the circle drawn on the screen in the drawer. */
        rows.sort((a, b) => (a.fresh || 0) - (b.fresh || 0))
          .forEach((r, i) => { r.num = i + 1 })
        state.rows = rows
        render()

        const problems = []
        if (open.e) problems.push(`Сервер анотацій (${ANN}) — ${open.e}`)
        if (md.e) problems.push(`fixlog.md — ${md.e}`)
        if (state.ratingsErr) problems.push(`Оцінки (${RATE}) — ${state.ratingsErr}`)
        /* Same-string guard: these repaint every cycle, and an idle strip
           must not be rebuilt (and reflowed) for identical content. */
        const warnHtml = problems.length
          ? `<div class="err">${problems.map(esc).join(' · ')}</div>` : ''
        if ($('warn').innerHTML !== warnHtml) $('warn').innerHTML = warnHtml

        const nNew = open.e ? 0 : open.v.pending.length
        const nWip = open.e ? 0 : open.v.wip.length
        const nNewShown = rows.filter((r) => r.status === 'new').length
        const nWipShown = rows.filter((r) => r.status === 'wip').length
        const nRedo = rows.filter((r) => stOf(r) === 'redo').length
        const nPaused = rows.filter((r) => r.status === 'paused').length
        /* The tally carries the same marks as the Статус column, so it
           doubles as that column's legend. The conditional entries only
           appear when they have something to say — a permanent «0 на
           доробці» would be noise in the busiest line on the page. */
        const items = [
          ['new', nNewShown, plural(nNewShown, 'нова', 'нові', 'нових')],
          ['wip', nWipShown, 'в роботі'],
        ]
        if (nPaused) items.push(['paused', nPaused, 'на паузі'])
        if (nRedo) items.push(['redo', nRedo, 'на доробці'])
        items.push(['done', done.length, plural(done.length, 'правка', 'правки', 'правок')])
        if (ghosts) items.push(['done', ghosts, 'дублів приховано'])
        const countHtml = items.map(([k, n, word]) =>
          `<span class="tally__i">${stMark(k)}<b>${n}</b> ${word}</span>`
        ).join('')
        if ($('count').innerHTML !== countHtml) $('count').innerHTML = countHtml
        document.title = `Fix log (${nNew}/${nWip}/${done.length}) · Куток`
        /* Крутиться рівно з того числа, що видно в лічильнику «в роботі», а
           не з сирого open.v.wip: дублі, приховані як ghost, у таблиці не
           показані, і іконка не має обіцяти роботу, якої на екрані немає. */
        favicon(nWipShown > 0)
      }


      /* Sticky engages silently; the shadow needs to know. Passive and
         cheap: one class flip when the panel's top crosses the viewport. */
      const headWraps = [$('gheadWrap')]
      addEventListener('scroll', () => {
        for (const w of headWraps) {
          w.classList.toggle('is-stuck', !w.hidden && w.getBoundingClientRect().top < 0)
        }
      }, { passive: true })

      /* Auto-refresh. The dispatcher works while this page is open, so a
         static snapshot is stale within a minute.

         Three guards, each for a real failure this page has already shown:
         — paused while a dialog is open, so a reload cannot yank the popup or
           the drawer out from under a click;
         — paused while the tab is hidden, so a page left open overnight is not
           still polling a dev server every 10s;
         — skipped if the previous cycle has not finished, since one pass fans
           out to ~120 session requests and they must not stack. */
      let inFlight = false
      const guardedLoad = async () => {
        if (inFlight) return
        if (!pop.hidden || !dr.hidden) return
        /* Ховану вкладку не опитуємо — окрім випадку, коли щось у роботі.
           Причина в іконці: крутілку видно саме тоді, коли на сторінку не
           дивляться, і якщо цикл при цьому спить, вона крутитиметься ще
           довго після того, як конвеєр усе доробив. Спінер, що бреше, гірший
           за його відсутність. Правило «сторінка, забута на ніч, не довбає
           дев-сервер» лишається чинним: без роботи в черзі опитування так
           само зупиняється. */
        if (document.hidden && !favicon.isRunning()) return
        inFlight = true
        try { await load() } finally { inFlight = false }
      }
      setInterval(guardedLoad, 10000)
      /* Coming back to the tab should feel current immediately, not in ten
         seconds. */
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) guardedLoad()
      })

      load()
    </script>
  </body>
</html>
